  FORMFIND

<html lang="en">
<head>

<title>FORMFIND</title>
<style>
  :root{
    --paper: #0B0C0E;
    --paper-deep: #060708;
    --card: #131519;
    --ink: #E8E9EB;
    --ink-soft: #8A8F98;
    --line: #23262C;
    --accent: #7DD3FC;
    --accent-deep: #38BDF8;
    --shadow: 0 1px 0 rgba(0,0,0,0.4), 0 10px 26px -12px rgba(0,0,0,0.7);
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-ui: 'Inter', sans-serif;
  }
  :root[data-theme="dark"]{ /* dark is the only theme this tool ships with — kept for template compatibility */
    --paper: #0B0C0E; --paper-deep: #060708; --card: #131519;
    --ink: #E8E9EB; --ink-soft: #8A8F98; --line: #23262C;
    --accent: #7DD3FC; --accent-deep: #38BDF8;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); min-height:100vh;
    overscroll-behavior-y:contain;
    padding-left:env(safe-area-inset-left);

  }
  a{color:var(--accent);}
  button{font-family:var(--font-ui); cursor:pointer;}
  input, select{font-family:var(--font-ui);}
  ::selection{background:var(--accent); color:#04121A;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .btn{
    font-family:var(--font-ui); font-weight:600; font-size:13px;
    padding:10px 16px; border-radius:7px;
    border:1.5px solid var(--ink); background:var(--ink); color:var(--paper-deep);
  }
  .btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn.accent{background:var(--accent); border-color:var(--accent); color:#04121A;}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.active{background:var(--accent); border-color:var(--accent); color:#04121A;}

  header.top{
    padding:calc(20px + env(safe-area-inset-top)) 20px 14px;
    text-align:center; border-bottom:1px solid var(--line);

    font-family:var(--font-display); margin:0; font-size:22px; letter-spacing:0.02em;

    font-family:var(--font-ui); font-size:12px; letter-spacing:0.08em; color:var(--ink-soft);
    margin:6px 0 0; text-transform:uppercase;

<script>
const APP_VERSION = '1.25.0'; // keep in sync with CHANGELOG.md top entry and the footer tag below

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ================= Confirm dialog (never native confirm() — see NEW_PROJECT_TEMPLATE.md) ================= */
function confirmDialog(message, confirmLabel = 'OK'){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p>${escapeHtml(message)}</p>
        <div class="confirm-actions">
          <button class="btn secondary" id="confirmCancel">Cancel</button>
          <button class="btn accent" id="confirmOk">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = (result)=>{ overlay.remove(); resolve(result); };
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) cleanup(false); });
    document.getElementById('confirmCancel').onclick = ()=>cleanup(false);
    document.getElementById('confirmOk').onclick = ()=>cleanup(true);
  });
}

function showHelp(){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:560px; max-height:82vh; overflow-y:auto; text-align:left;">
      <h2 style="font-family:var(--font-display); font-size:19px; margin:0 0 4px;">FORMFIND — help</h2>
      <p style="font-size:13px; color:var(--ink-soft); margin:0 0 18px;">A field of kinetic spheres, inspired by ART+COM's BMW Kinetic Sculpture.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Camera</h3>
      <p style="font-size:14px; line-height:1.5; margin:0;">Drag to orbit, scroll to zoom. "Auto-rotate" toggles the slow ambient spin.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Ambient loop</h3>
      <p style="font-size:14px; line-height:1.5; margin:0;">Auto-cycles chaos → a shape (text or a preset) → chaos, forever. Speed and Turbulence sliders shape the motion in every mode.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Manual</h3>
      <p style="font-size:14px; line-height:1.5; margin:0;">Type a word (max 12 characters) and click Resolve, or pick a preset — Circle, Car profile, Skyline, Blob. Scramble sends the field back to chaos.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Audio</h3>
      <p style="font-size:14px; line-height:1.5; margin:0 0 8px;">Upload a file or use your microphone. The field becomes a live equalizer — bass on the left, treble on the right — with a beat detector driving a shimmer pulse across the whole grid. Rewind/play-pause/stop/forward controls appear once a source is connected (the mic gets a "Stop microphone" button instead, since there's nothing to seek on a live stream).</p>
      <p style="font-size:14px; line-height:1.5; margin:0;"><strong>Stems:</strong> FORMFIND doesn't separate a mixed song itself — that needs a trained model. Run your track through <a href="https://github.com/facebookresearch/demucs" target="_blank" rel="noopener">Demucs</a> (free, command-line), <a href="https://www.lalal.ai/stem-splitter/" target="_blank" rel="noopener">LALAL.AI</a>, or <a href="https://moises.ai" target="_blank" rel="noopener">Moises</a> first, then upload the resulting Vocals/Drums/Bass/Other files. Each sphere colors toward whichever stem is loudest at that column right now; the legend shows which color is which. The same transport controls move all loaded stems together, kept in sync.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Physical rig (optional)</h3>
      <p style="font-size:14px; line-height:1.5; margin:0 0 8px;">Drives a real row of hobby servos over WebSerial — Chrome or Edge on desktop only, not supported in Firefox/Safari or on mobile. Whatever's on screen (any mode) gets mirrored to the servos live. Set the servo count to match your build, click Connect Arduino, and pick the port. The paired sketch is <code>arduino/formfind_servo/formfind_servo.ino</code> — see the comments at the top of that file for wiring and power notes (servos need their own power supply once you're past 1-2 of them, not the Arduino's 5V/USB). The WebSerial connection itself lives in <code>hardware-bridge.js</code>, a small shared module — the same rig can be driven by other tools in the generative-design-tools suite without re-wiring the connection logic each time.</p>
      <p style="font-size:14px; line-height:1.5; margin:0;">No hardware yet? Check "Show simulated rig" for a literal 3D preview — a row of launch canisters, each firing particles upward like a firework mortar, launch speed and arc height driven by that servo's real angle, with a side/angled view toggle. It's driven by FORMFIND's real firmware itself (avr8js, embedded in this page — no terminal, no install), each canister's launch measured off real simulated PWM rather than mirrored from what's on screen, then slew-rate-limited to a realistic servo speed (~300°/s) so you can tell if something's moving too fast for real hardware before you build it.</p>
      <p style="font-size:14px; line-height:1.5; margin:0 0 0 0; margin-top:8px;"><strong>Sensor input:</strong> the loop can run the other way too. Wire a potentiometer or photoresistor to the Arduino (see the sketch's comments for wiring), set "Sensor drives" to Turbulence or Speed, and a physical knob or light level controls what's on screen live — the corresponding slider moves to match. Set it to Off to ignore incoming readings.</p>
      <p style="font-size:14px; line-height:1.5; margin:8px 0 0;"><strong>Simulated rig:</strong> check "Show simulated rig" in the Physical Rig panel for a 3D preview — a row of launch canisters firing particles upward, firework-mortar style, driven by that servo's real angle. This now runs FORMFIND's actual compiled firmware (avr8js, github.com/wokwi/avr8js) directly in this browser tab — no terminal, no Node.js, no install; each canister's launch is measured off real simulated PWM, not mirrored from on-screen state. If that fails to load (offline, CDN blocked), it falls back to a direct preview automatically rather than breaking. The external <code>avr8js_sim_bridge.js</code> script and its own browser dashboard (<code>http://localhost:8766</code>) still work too, if you want a separate window or a <code>ws://</code> endpoint other tools can connect to — see AVR8JS_SETUP.md.</p>

      <div class="confirm-actions" style="margin-top:20px;">
        <button class="btn accent" id="helpClose">Got it</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cleanup = ()=>overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) cleanup(); });
  document.getElementById('helpClose').onclick = cleanup;
}

/* ================= Helpers ================= */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================= Three.js sphere-field engine ================= */
const engine = {
  mode: 'ambient',
  speed: 1.0,
  turbulence: 1.0,
  autoRotate: true,
  ambientTimer: 0,
  ambientPhase: 'chaos', // 'chaos' -> 'hold-chaos' -> 'resolving' -> 'hold-shape' -> 'unresolving'
  ambientPresetIdx: 0,
  ready: false,
};

const GRID_COLS = 44;
const GRID_ROWS = 22;
const SPHERE_COUNT = GRID_COLS * GRID_ROWS;
const AMBIENT_PRESETS = ['circle','car','skyline','blob','text'];
const PEAK_HEIGHT = 3.2; // shared resolve/audio height scale, spheres-per-unit-Y

let three = null; // holds { THREE, scene, camera, renderer, controls, categoryMeshes, dummy, ... }

/* ================= Stem coloring =================
   FORMFIND does not separate a mixed song itself — that needs a trained model
   (Demucs, etc.) run externally. It accepts up to 4 already-separated stem
   files and colors each sphere by whichever stem is driving its height most. */
const STEM_KEYS = ['vocals', 'drums', 'bass', 'other'];
const STEM_LABELS = { vocals: 'Vocals', drums: 'Drums', bass: 'Bass', other: 'Other / guitar' };
const STEM_COLORS = { vocals: 0xE97452, drums: 0x7DD3FC, bass: 0xB98AFF, other: 0x8CE99A };
const BASE_SPHERE_COLOR = 0xd7dbe0;
const colTotalBuf = new Float32Array(GRID_COLS);
const colDominantBuf = new Int8Array(GRID_COLS);

/* ================= Audio-reactive engine =================
   Beat-driven turbulence + per-column frequency-band shaping (a live equalizer
   mapped across the grid). Works from an uploaded file, the microphone, or up
   to 4 separated stem files (see STEM_KEYS above). */
const audioEngine = {
  ctx: null,
  analyser: null,
  freqData: null,
  sourceNode: null,   // current MediaElementAudioSourceNode or MediaStreamAudioSourceNode
  audioEl: null,
  micStream: null,
  active: false,       // true once a single (file/mic) source is connected and running
  sourceKind: null,    // 'file' | 'mic' | 'stems'
  bassEMA: 0,
  beatPulse: 0,
  beatCooldown: 0,
  colEnergy: new Float32Array(GRID_COLS),
  stemsActive: false,
  stems: { vocals: null, drums: null, bass: null, other: null }, // lazily created per-stem state
  stemSyncTimer: 0, // periodic drift-correction accumulator — see updateStemsFrame
};

/* ================= Hardware bridge (WebSerial -> Arduino servos) =================
   Mirrors whatever's currently on screen — ambient, manual, or audio, whatever mode
   is active — to a physical rig of hobby servos, one per evenly-spaced column band.
   Chrome/Edge only (WebSerial isn't in the spec for Firefox/Safari). Protocol and
   firmware: see arduino/formfind_servo/formfind_servo.ino. */
const HW_HEIGHT_MIN = -2, HW_HEIGHT_MAX = 4; // absolute fallback range only — see HW_AGC below for the range actually used
const HW_ANGLE_MIN = 20, HW_ANGLE_MAX = 160; // stay off the 0/180 end-stops
const HW_SEND_INTERVAL_MS = 50; // ~20Hz — plenty for visible motion, easy on the Uno's serial buffer
// Auto-gain per band: a fixed height->angle window (above) meant most songs/sections only ever
// filled a narrow slice of it, so the real signal barely moved the arms even though the audio
// underneath was genuinely dynamic — this was the actual cause of the rig looking "stagnant",
// not a lack of decoration. Each band tracks its own recent min/max and maps against THAT,
// so a quiet verse and a loud chorus both use the full angle swing, and a change in the real
// per-band average height still reads as a real angle change either way.
let hwAgcMin = null, hwAgcMax = null; // lazily sized to servoCount in computeServoAngles
const HW_AGC_RISE = 0.35, HW_AGC_FALL_PER_SEC = 0.55; // peaks/floors track fast up, relax slowly back
let hwAgcLastT = null; // computeServoAngles is called both from rAF (3D preview) and hardware-bridge.js's own interval (real hardware) — self-timed so it works from either
const hardwareEngine = {
  connected: false,
  servoCount: 8,
  simulate: false,   // 3D rig preview — lets you verify the mapping/timing/motion speed with no Arduino attached
  sensorTarget: 'off', // 'off' | 'turbulence' | 'speed' — what an incoming sensor reading drives
  sensorLastRaw: null, // last analogRead() value received, 0-1023
};

function mapRange(v, inMin, inMax, outMin, outMax){
  const t = (v - inMin) / (inMax - inMin);
  return outMin + Math.max(0, Math.min(1, t)) * (outMax - outMin);
}

/* Connect/disconnect, the send loop, and the sensor read loop all live in
   shared/hardware-bridge.js now — pulled out so any of the other generative-
   design-tools can drive the same physical rig without re-implementing the
   WebSerial plumbing. FORMFIND supplies its own getAngles/onSensorReading;
   everything else is generic. Dynamically imported, same pattern as three.js
   below, since this script isn't itself a module. */
let hwBridge = null;
async function ensureHwBridge(){
  if(hwBridge) return hwBridge;
  const { createHardwareBridge } = await import('./hardware-bridge.js');
  hwBridge = createHardwareBridge({
    getAngles: computeServoAngles,
    onSensorReading: (norm, raw) => {
      hardwareEngine.sensorLastRaw = raw;
      applySensorReading(norm);
      const status = document.getElementById('hwSensorStatus');
      if(status) status.textContent = `Sensor: ${raw}/1023 (${norm.toFixed(2)})`;
    },
    onStatusChange: (status, message) => {
      hardwareEngine.connected = (status === 'connected');
      updateHardwareUi();
      const statusEl = document.getElementById('hwStatus');
      if(statusEl){
        if(status === 'connected') statusEl.textContent = `Connected — driving ${hardwareEngine.servoCount} servo(s).`;
        else if(status === 'disconnected') statusEl.textContent = 'Not connected.';
        else if(status === 'error' && message) statusEl.textContent = message;
      }
      if(status === 'error' && message) toast(message);
    },
    sendIntervalMs: HW_SEND_INTERVAL_MS,
  });
  return hwBridge;
}

let wokwiWsBridge = null;
async function ensureWokwiWsBridge(url){
  const { createWebSocketBridge } = await import('./hardware-bridge.js');
  // Rebuild if the URL changed since last connect — createWebSocketBridge bakes the URL in at creation.
  if(wokwiWsBridge && wokwiWsBridge._url === url) return wokwiWsBridge;
  wokwiWsBridge = createWebSocketBridge({
    url,
    getAngles: computeServoAngles,
    onSensorReading: (norm, raw) => {
      hardwareEngine.sensorLastRaw = raw;
      applySensorReading(norm);
      const status = document.getElementById('hwSensorStatus');
      if(status) status.textContent = `Sensor: ${raw}/1023 (${norm.toFixed(2)})`;
    },
    onStatusChange: (status, message) => {
      const connectBtn = document.getElementById('wokwiWsConnectBtn');
      const disconnectBtn = document.getElementById('wokwiWsDisconnectBtn');
      const statusEl = document.getElementById('wokwiWsStatus');
      if(connectBtn) connectBtn.style.display = status === 'connected' ? 'none' : 'inline-flex';
      if(disconnectBtn) disconnectBtn.style.display = status === 'connected' ? 'inline-flex' : 'none';
      if(statusEl){
        if(status === 'connected') statusEl.textContent = `Connected — driving ${hardwareEngine.servoCount} servo(s) via simulator bridge.`;
        else if(status === 'disconnected') statusEl.textContent = 'Not connected.';
        else if(status === 'error' && message) statusEl.textContent = message;
      }
      if(status === 'error' && message) toast(message);
    },
    sendIntervalMs: HW_SEND_INTERVAL_MS,
  });
  wokwiWsBridge._url = url;
  return wokwiWsBridge;
}

function applySensorReading(norm){
  if(hardwareEngine.sensorTarget === 'turbulence'){
    engine.turbulence = mapRange(norm, 0, 1, 0, 2);
    const slider = document.getElementById('turbSlider'), val = document.getElementById('turbVal');
    if(slider){ slider.value = engine.turbulence; }
    if(val){ val.textContent = engine.turbulence.toFixed(1); }
  } else if(hardwareEngine.sensorTarget === 'speed'){
    engine.speed = mapRange(norm, 0, 1, 0.2, 2.5);
    const slider = document.getElementById('speedSlider'), val = document.getElementById('speedVal');
    if(slider){ slider.value = engine.speed; }
    if(val){ val.textContent = engine.speed.toFixed(1); }
  }
}

/* ================= Embedded avr8js firmware simulation =================
   Runs formfind_servo.ino's REAL compiled firmware directly in this browser
   tab via avr8js (github.com/wokwi/avr8js, MIT — the same open-source AVR
   core that powers Wokwi itself, which runs entirely client-side). No
   Node.js, no terminal, no npm install — this is the exact same simulation
   formfind_servo/avr8js_sim_bridge.js does from a terminal (same hex, same
   CPU/peripheral setup, same PWM-pulse decode), just running inside this
   page instead. That external script + its own live dashboard still work
   and remain useful (a separate window, a shareable ws:// endpoint for
   other tools) — this doesn't replace them, it just means checking "Show
   simulated rig" needs nothing else running.
   Loaded from a CDN (jsdelivr) at runtime, not bundled — if that fails
   (offline, CDN blocked), this falls back to the direct angle-mirror
   preview FORMFIND always had, rather than breaking outright. */
/* ================= Embedded avr8js firmware simulation (Web Worker) =================
   Runs formfind_servo.ino's REAL compiled firmware inside avr8js
   (github.com/wokwi/avr8js, MIT — the same open-source AVR core that powers
   Wokwi itself). Executes in a dedicated Web Worker, not the main thread —
   the raw AVR instruction-stepping loop is real per-cycle CPU emulation and
   was measurably heavy enough running on the main thread to compete with
   the kinetic-sculpture render loop and with <audio> element scheduling

const HW_FIRMWARE_SERVO_COUNT = 8; // matches formfind_servo.ino's NUM_SERVOS/SERVO_PINS exactly — fixed by the real compiled firmware, not by the "servo count" field (that field still controls how many angles go out to real/external hardware; the embedded preview always mirrors the real 8-pin sketch)

const HW_FIRMWARE_WORKER_SRC = `
let cpu = null, avrInstruction = null, usart = null, adc = null;
const decodedAngles = new Float64Array(8).fill(90);
let rxQueue = [];
const SERVO_PIN_MAP = [
  { port: 'D', bit: 2 }, { port: 'D', bit: 3 }, { port: 'D', bit: 4 }, { port: 'D', bit: 5 },
  { port: 'D', bit: 6 }, { port: 'D', bit: 7 }, { port: 'B', bit: 0 }, { port: 'B', bit: 1 },
];
const MIN_PULSE_US = 544, MAX_PULSE_US = 2400;
const riseCycle = { D: new Array(8).fill(null), B: new Array(8).fill(null) };

function loadIntelHex(source, target){
  for(const line of source.split('\\n')){
    if(line[0] === ':' && line.substr(7, 2) === '00'){
      const bytes = parseInt(line.substr(1, 2), 16);
      const addr = parseInt(line.substr(3, 4), 16);
      for(let i = 0; i < bytes; i++) target[addr + i] = parseInt(line.substr(9 + i * 2, 2), 16);
    }
  }
}

function handlePortEdges(port, value, oldValue){
  const changed = value ^ oldValue;
  for(let bit = 0; bit < 8; bit++){
    if(!((changed >> bit) & 1)) continue;
    const isHigh = !!((value >> bit) & 1);
    if(isHigh){
      riseCycle[port][bit] = cpu.cycles;
    } else if(riseCycle[port][bit] !== null){
      const pulseUs = (cpu.cycles - riseCycle[port][bit]) / 16;
      riseCycle[port][bit] = null;
      const idx = SERVO_PIN_MAP.findIndex((m) => m.port === port && m.bit === bit);
      if(idx !== -1 && pulseUs > 300 && pulseUs < 3000){
        decodedAngles[idx] = Math.max(0, Math.min(180, ((pulseUs - MIN_PULSE_US) / (MAX_PULSE_US - MIN_PULSE_US)) * 180));
      }
    }
  }
}

let ready = false;
const SUBSTEP_CYCLES = 200, MAX_CATCHUP_SEC = 0.25, MHZ = 16e6;
let startWall = null;
let postCounter = 0;
const POST_EVERY_N_TICKS = 12; // tick runs every 4ms internally; post decoded angles back roughly every ~48ms (~20Hz), not every tick

function tick(){
  const elapsedSec = (performance.now() - startWall) / 1000;
  let targetCycles = Math.floor(elapsedSec * MHZ);
  if(targetCycles - cpu.cycles > MAX_CATCHUP_SEC * MHZ) targetCycles = cpu.cycles + MAX_CATCHUP_SEC * MHZ;
  while(cpu.cycles < targetCycles){
    const stepTarget = Math.min(targetCycles, cpu.cycles + SUBSTEP_CYCLES);
    while(cpu.cycles < stepTarget){ avrInstruction(cpu); cpu.tick(); }
    if(rxQueue.length && !usart.rxBusy) usart.writeByte(rxQueue.shift());
  }
  const sensorPhase = (cpu.cycles / MHZ) % 12;
  const p = sensorPhase < 6 ? sensorPhase / 6 : (12 - sensorPhase) / 6;
  adc.channelValues[0] = p * 5;

  postCounter++;
  if(postCounter >= POST_EVERY_N_TICKS){
    postCounter = 0;
    self.postMessage({ type: 'angles', angles: Array.from(decodedAngles) });
  }
}

self.onmessage = async (e) => {
  const msg = e.data;
  if(msg.type === 'init'){
    try {
      const avr = await import('https://cdn.jsdelivr.net/npm/avr8js@0.21.0/+esm');
      const { CPU, avrInstruction: avrInstr, AVRIOPort, AVRTimer, AVRUSART, AVRADC,
              portBConfig, portCConfig, portDConfig,
              timer0Config, timer1Config, timer2Config,
              usart0Config, adcConfig } = avr;
      avrInstruction = avrInstr;
      const program = new Uint16Array(0x8000);
      loadIntelHex(msg.hex, new Uint8Array(program.buffer));
      cpu = new CPU(program);
      new AVRTimer(cpu, timer0Config);
      new AVRTimer(cpu, timer1Config);
      new AVRTimer(cpu, timer2Config);
      const portB = new AVRIOPort(cpu, portBConfig);
      new AVRIOPort(cpu, portCConfig);
      const portD = new AVRIOPort(cpu, portDConfig);
      usart = new AVRUSART(cpu, usart0Config, MHZ);
      adc = new AVRADC(cpu, adcConfig);
      adc.avcc = 5;
      portD.addListener((v, o) => handlePortEdges('D', v, o));
      portB.addListener((v, o) => handlePortEdges('B', v, o));
      ready = true;
      startWall = performance.now();
      setInterval(tick, 4);
      self.postMessage({ type: 'ready' });
    } catch(err){
      self.postMessage({ type: 'failed', message: String((err && err.message) || err) });
    }
  } else if(msg.type === 'command'){
    if(!ready) return;
    const line = 'A' + msg.angles.map((a) => Math.round(a)).join(',') + '\\n';
    for(const ch of line) rxQueue.push(ch.charCodeAt(0) & 0xff);
  }
};
`;

let hwFirmwareWorker = null;
let hwFirmwareState = 'idle'; // 'idle' | 'loading' | 'ready' | 'failed'

function ensureHwFirmwareWorker(){
  if(hwFirmwareWorker || hwFirmwareState === 'failed') return;
  hwFirmwareState = 'loading';
  try {
    const blob = new Blob([HW_FIRMWARE_WORKER_SRC], { type: 'application/javascript' });
    hwFirmwareWorker = new Worker(URL.createObjectURL(blob), { type: 'module' });
    hwFirmwareWorker.onmessage = (e) => {
      const msg = e.data;
      if(msg.type === 'ready') hwFirmwareState = 'ready';
      else if(msg.type === 'failed'){ hwFirmwareState = 'failed'; console.error('Embedded firmware worker failed to load (falling back to direct preview):', msg.message); }
      else if(msg.type === 'angles') hwFirmwareAngles = msg.angles;
    };
    hwFirmwareWorker.onerror = (err) => {
      hwFirmwareState = 'failed';
      console.error('Embedded firmware worker error (falling back to direct preview):', err);
    };
    hwFirmwareWorker.postMessage({ type: 'init', hex: EMBEDDED_FIRMWARE_HEX });
  } catch(err){
    hwFirmwareState = 'failed';
    console.error('Could not create firmware worker (falling back to direct preview):', err);
  }
}

function resampleToFirmwareServoCount(angles){
  const n = angles.length;
  if(n === HW_FIRMWARE_SERVO_COUNT) return angles;
  const out = new Array(HW_FIRMWARE_SERVO_COUNT);
  for(let i = 0; i < HW_FIRMWARE_SERVO_COUNT; i++){
    out[i] = angles[Math.min(n - 1, Math.floor((i * n) / HW_FIRMWARE_SERVO_COUNT))];
  }
  return out;
}

function computeServoAngles(){
  const n = hardwareEngine.servoCount;
  const bandWidth = GRID_COLS / n;
  const sums = new Float32Array(n);
  const counts = new Int32Array(n);
  for(let i = 0; i < SPHERE_COUNT; i++){
    const col = i % GRID_COLS;
    const band = Math.min(n - 1, Math.floor(col / bandWidth));
    sums[band] += state.currentY[i];
    counts[band]++;
  }

  const now = performance.now();
  const dt = hwAgcLastT === null ? 0.016 : Math.min(0.25, (now - hwAgcLastT) / 1000);
  hwAgcLastT = now;
  if(!hwAgcMin || hwAgcMin.length !== n){
    hwAgcMin = new Float32Array(n).fill(HW_HEIGHT_MIN);
    hwAgcMax = new Float32Array(n).fill(HW_HEIGHT_MAX);
  }
  const fallStep = HW_AGC_FALL_PER_SEC * dt;

  const angles = new Array(n);
  for(let b = 0; b < n; b++){
    const avg = counts[b] ? sums[b] / counts[b] : 0;

    // Auto-gain: each band's own recent floor/ceiling, not a fixed absolute range — this is what
    // actually fixed the "stagnant" look, since the real per-band signal now uses its full swing
    // regardless of whether the current section (or mode) is quiet or loud.
    if(avg > hwAgcMax[b]) hwAgcMax[b] += (avg - hwAgcMax[b]) * HW_AGC_RISE;
    else hwAgcMax[b] = Math.max(avg, hwAgcMax[b] - fallStep);
    if(avg < hwAgcMin[b]) hwAgcMin[b] += (avg - hwAgcMin[b]) * HW_AGC_RISE;
    else hwAgcMin[b] = Math.min(avg, hwAgcMin[b] + fallStep);
    const span = Math.max(0.5, hwAgcMax[b] - hwAgcMin[b]); // floor on span so near-silence doesn't get amplified into noise

    angles[b] = Math.round(mapRange(avg, hwAgcMin[b], hwAgcMin[b] + span, HW_ANGLE_MIN, HW_ANGLE_MAX));
  }
  return angles;
}

const HW_SERVO_SLEW_DEG_PER_SEC = 300; // ~a typical standard hobby servo's real top speed — the sim can't move faster than hardware could

let hwSim = null; // { THREE, scene, camera, renderer, container, count, currentAngles, totalWidth, viewMode, emitterEnergy }

// Row of servo-driven "energy emitters" — one per real firmware pin, arranged like the popsicle-stick
// figures used to be, but rendered as glowing markers each bursting particles whose speed/size are
// driven by that channel's real angle deviation-from-neutral plus its real rate-of-change (frame to
// frame, already slew-rate-limited to ~300°/s like real hardware, so the "how fast" reading is
// physically real, not synthetic). Matches the visual language introduced in avr8js_sim_bridge.js's
// standalone dashboard (v1.23.0/1) — glowing ring emitters, additive particle bursts — applied here
// to the embedded row layout instead of a ring, since the row is what the camera/view-toggle system
// below is fit to.
const HW_CANISTER_H = 0.24; // launch tube height — particles fire from its mouth, like a firework mortar
const HW_IDLE_BOB_HZ = 0.55, HW_IDLE_BOB_AMPLITUDE = 0.015; // tiny idle shimmer on the opening ring, purely decorative
const HW_GRAVITY = 3.1; // pulls launched particles into a real arc instead of a flat radial burst
const HW_SPARK_THRESHOLD_DEG = 3; // how close to 0/180 counts as "hit the extreme"
const HW_SPARK_DURATION = 0.4; // seconds
const HW_PER_EMITTER_PARTICLES = 22; // fewer particles per emitter — dense overlapping additive sprites were part of what was blowing out to white

function hwPseudoRandom(seed){ // deterministic per-index "randomness" so re-running doesn't reshuffle character variation
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

function hwSpriteTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.4)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return c;
}

function ensureHwSimScene(){
  if(!three || !three.THREE) return false; // main engine not loaded yet
  const container = document.getElementById('hwSimViewport');
  if(!container) return false;
  if(hwSim && hwSim.count === HW_FIRMWARE_SERVO_COUNT) return true; // always 8 now — mirrors the real compiled sketch, not the "servo count" field (see resampleToFirmwareServoCount)

  const THREE = three.THREE;
  if(hwSim){
    hwSim.renderer.dispose();
    container.innerHTML = '';
  }

  const w = container.clientWidth || 400, h = 360; // taller now that bursts launch upward like fireworks and need real headroom, not just a strip
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060708);
  scene.fog = new THREE.Fog(0x060708, 8, 22);

  const n = HW_FIRMWARE_SERVO_COUNT; // always 8 — the on-screen preview mirrors the real compiled sketch's fixed pin count
  const spacing = 1.0;
  const totalWidth = (n - 1) * spacing;
  const requiredHeight = 6.5; // tall enough to frame a full launch-arc-fade arc, not just a strip at ground level
  const requiredWidth = totalWidth + 3.0; // room for lateral scatter on launch
  const aspect = w / h;

  // Perspective, not orthographic — reads as genuinely 3D (matches the main kinetic-sculpture
  // stage's own camera) instead of the flat/pancake look an orthographic projection gives a row
  // of 3D content. Distance is fit to the content once here and reused for both view modes in
  // setHwSimView, with a margin generous enough that rotating to the angled azimuth doesn't push
  // anything outside the frustum.
  const FOV_DEG = 45;
  const vFov = THREE.MathUtils.degToRad(FOV_DEG);
  const distForHeight = (requiredHeight / 2) / Math.tan(vFov / 2);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const distForWidth = (requiredWidth / 2) / Math.tan(hFov / 2);
  const fitDist = Math.max(distForHeight, distForWidth) * 1.35; // margin covers the angled-view azimuth safely

  const camera = new THREE.PerspectiveCamera(FOV_DEG, aspect, 0.1, 60);

  scene.add(new THREE.AmbientLight(0x8899aa, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 0.5);
  key.position.set(3, 5, 6);
  scene.add(key);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  // No tone mapping was set here before, so overlapping additive sprites just clipped every
  // channel straight to 1.0 the moment a few bursts overlapped — reads as a blown-out white
  // blob instead of distinct colored bursts, worse the busier the audio gets. ACES compresses
  // the highlights instead of hard-clipping, so color survives even where several bursts overlap.
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  // ground glow strip, purely a visual anchor for the row (subtle, not data-driven)
  const stripGeo = new THREE.PlaneGeometry(totalWidth + 2.2, 0.4);
  const stripMat = new THREE.MeshBasicMaterial({ color: 0x131519, transparent: true, opacity: 0.6 });
  const strip = new THREE.Mesh(stripGeo, stripMat);
  strip.rotation.x = -Math.PI / 2;
  strip.position.set(0, 0.01, 0);
  scene.add(strip);

  // Launch canisters — a short dark tube sunk into the ground strip per servo, with a glowing
  // opening ring at the mouth (the one real-data-driven part: brightness tracks that channel's
  // real angle deviation, same role the old floating marker played). Particles now spawn from
  // the mouth and launch upward like a firework mortar instead of bursting outward from a
  // floating point in mid-air.
  const canisterGeo = new THREE.CylinderGeometry(0.1, 0.13, HW_CANISTER_H, 14);
  canisterGeo.translate(0, HW_CANISTER_H / 2, 0); // pivot at the base so it sits flush on the ground
  const canisterMat = new THREE.MeshStandardMaterial({ color: 0x1c1e23, metalness: 0.6, roughness: 0.5 });
  const voidGeo = new THREE.CircleGeometry(0.075, 16);
  const voidMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const ringGeo = new THREE.RingGeometry(0.06, 0.105, 22);

  const emitterPositions = [];
  const emitterMarkers = []; // the glowing opening ring per canister — same "marker" role as before
  const markerMats = [];
  for(let i = 0; i < n; i++){
    const x = i * spacing - totalWidth / 2;
    emitterPositions.push(new THREE.Vector3(x, HW_CANISTER_H, 0));

    const canister = new THREE.Mesh(canisterGeo, canisterMat);
    canister.position.set(x, 0, 0);
    scene.add(canister);

    const voidDisc = new THREE.Mesh(voidGeo, voidMat); // suggests a hollow bore, not a solid cap
    voidDisc.rotation.x = -Math.PI / 2;
    voidDisc.position.set(x, HW_CANISTER_H - 0.03, 0);
    scene.add(voidDisc);

    const rnd = hwPseudoRandom(i * 7.3); // 0..1, deterministic per emitter — individuality, not per-frame noise
    const markerColor = new THREE.Color(BASE_SPHERE_COLOR).offsetHSL((rnd - 0.5) * 0.08, 0, 0);
    const markerMat = new THREE.MeshStandardMaterial({ color: markerColor, metalness: 0.4, roughness: 0.4, emissive: markerColor, emissiveIntensity: 0, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, markerMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, HW_CANISTER_H + 0.006, 0);
    scene.add(ring);

    emitterMarkers.push(ring);
    markerMats.push(markerMat);
  }

  const spriteTex = new THREE.CanvasTexture(hwSpriteTexture());

  // Particle burst system — additive sprites, custom shader for per-particle size (see
  // avr8js_sim_bridge.js's dashboard for the same technique; safe to use a plain template-literal
  // shader string here since, unlike that file, this code isn't itself embedded inside an outer
  // template literal — no double-escaping risk).
  const total = n * HW_PER_EMITTER_PARTICLES;
  const positions = new Float32Array(total * 3);
  const colorsAttr = new Float32Array(total * 3);
  const sizesAttr = new Float32Array(total);
  const pVel = [];
  const pAge = new Float32Array(total);
  const pLife = new Float32Array(total);
  const pEmitter = new Uint16Array(total);

  function hueForEmitter(i){ return 0.52 + (i / n) * 0.32; }

  function respawnParticle(p, energy){
    const e = pEmitter[p];
    const origin = emitterPositions[e];
    positions[p * 3] = origin.x;
    positions[p * 3 + 1] = origin.y;
    positions[p * 3 + 2] = origin.z;
    // Launch mostly straight up, like a mortar shot — energy sets how hard it fires, gravity
    // (applied per-frame in updateHwSimulator) bends the flight into a real arc rather than a
    // radial burst. Small lateral scatter so it doesn't look like a single ruler-straight line.
    const spread = 0.25 + energy * 0.5;
    const vx = (Math.random() - 0.5) * spread;
    const vz = (Math.random() - 0.5) * spread;
    const vy = 1.6 + energy * 3.3 + Math.random() * 0.4;
    pVel[p] = new THREE.Vector3(vx, vy, vz);
    pAge[p] = 0;
    pLife[p] = 0.7 + Math.random() * 0.9; // fades mid-arc/near-apex, the way real shell sparks burn out
    sizesAttr[p] = 0;
  }

  for(let p = 0; p < total; p++){
    pEmitter[p] = Math.floor(p / HW_PER_EMITTER_PARTICLES);
    const c = new THREE.Color().setHSL(hueForEmitter(pEmitter[p]), 0.85, 0.62);
    colorsAttr[p * 3] = c.r; colorsAttr[p * 3 + 1] = c.g; colorsAttr[p * 3 + 2] = c.b;

    pAge[p] = Math.random() * pLife[p]; // desync initial bursts
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colorsAttr, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizesAttr, 1));

  const particleMat = new THREE.ShaderMaterial({
    uniforms: { map: { value: spriteTex } },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      varying vec3 vColor;
      void main(){
        vColor = color;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (260.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      precision mediump float;
      uniform sampler2D map;
      varying vec3 vColor;
      void main(){
        vec4 tex = texture2D(map, gl_PointCoord);
        gl_FragColor = vec4(vColor, 1.0) * tex;
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const points = new THREE.Points(geo, particleMat);
  scene.add(points);

  const prevAngles = hwSim ? hwSim.currentAngles : null;
  const currentAngles = new Float32Array(n).fill(90);
  if(prevAngles) currentAngles.set(prevAngles.subarray(0, Math.min(n, prevAngles.length)));

  hwSim = {
    THREE, scene, camera, renderer, container, fitDist,
    emitterMarkers, markerMats, emitterPositions,
    positions, colorsAttr, sizesAttr, pVel, pAge, pLife, pEmitter, respawnParticle, geo, points,
    emitterEnergy: new Float32Array(n),
    sparkT: new Float32Array(n).fill(-1), // -1 = not currently sparking
    count: n, currentAngles, totalWidth, viewMode: (hwSim ? hwSim.viewMode : 'side'),
  };
  setHwSimView(hwSim.viewMode);
  return true;
}

function setHwSimView(mode){
  if(!hwSim) return;
  hwSim.viewMode = mode;
  const THREE = hwSim.THREE, d = hwSim.fitDist, targetY = 1.7; // raised from the old 1.0 — launches now arc well above the row, so the camera needs to look further up the column, not just at ground-row height
  if(mode === 'angle'){
    const az = THREE.MathUtils.degToRad(34), el = THREE.MathUtils.degToRad(14);
    const horizR = d * Math.cos(el);
    hwSim.camera.position.set(horizR * Math.sin(az), targetY + d * Math.sin(el), horizR * Math.cos(az));
  } else {
    hwSim.camera.position.set(0, targetY, d);
  }
  hwSim.camera.lookAt(0, targetY, 0);
  const btn = document.getElementById('hwSimViewBtn');
  if(btn) btn.textContent = mode === 'angle' ? 'Side view' : 'Angled view';
}

function updateHwSimulator(now, dt){
  if(!hardwareEngine.simulate) return;
  if(!ensureHwSimScene()) return;

  // Command angles come from the same computeServoAngles() real/external hardware already uses
  // (same AGC, same servoCount) — resampled to exactly 8 to match the real firmware's fixed pin
  // count, then sent to the worker running the real compiled firmware, throttled to ~20Hz (no
  // need to postMessage a new command every single render frame). If the worker isn't ready yet
  // (or failed to load — offline, CDN blocked), target falls back to the commanded angles
  // directly, same as the app always did before this existed, so the preview never breaks.
  const commandAngles = resampleToFirmwareServoCount(computeServoAngles());
  if(hwFirmwareState === 'idle') ensureHwFirmwareWorker(); // fire-and-forget; only kicks off once
  let target = commandAngles;
  hwSim.usingRealFirmware = false;
  if(hwFirmwareState === 'ready' && hwFirmwareAngles){
    target = hwFirmwareAngles; // the real angle the real firmware's real PWM last emitted, read from the worker — no per-frame simulation cost on this thread
    hwSim.usingRealFirmware = true;
    hwFirmwareCommandTimer += dt;
    if(hwFirmwareCommandTimer > HW_FIRMWARE_COMMAND_INTERVAL){
      hwFirmwareCommandTimer = 0;
      hwFirmwareWorker.postMessage({ type: 'command', angles: commandAngles });
    }
  }
  updateHwFirmwareStatusUi();

  const maxStep = HW_SERVO_SLEW_DEG_PER_SEC * dt; // real servos can't snap instantly to a new angle
  const moodMul = hardwareEngine.connected ? 1.4 : 1.0; // perk up when an actual rig/bridge is connected
  const tSec = now / 1000;
  // Real beat-onset signal, already computed for the main field's shimmer (audioEngine.beatPulse) —
  // reused here as a shared burst boost across every emitter on every detected beat. Only active
  // in Audio mode; 0 otherwise, so it never fakes motion when there's no real beat to react to.
  const beat = (engine.mode === 'audio') ? audioEngine.beatPulse : 0;

  for(let i = 0; i < hwSim.count; i++){
    const cur = hwSim.currentAngles[i];
    const tgt = target[i] !== undefined ? target[i] : 90;
    const step = Math.max(-maxStep, Math.min(maxStep, tgt - cur));
    const prevAngle = cur;
    hwSim.currentAngles[i] = cur + step;
    const angle = hwSim.currentAngles[i];

    // Energy = how displaced from neutral + how fast this channel is actually moving right now
    // (the slew-limited per-frame delta is a real, physically-bounded rate — same discipline as
    // the standalone dashboard's angle-deviation-plus-rate-of-change measure).
    const deviation = Math.abs(angle - 90) / 90; // 0..1
    const delta = Math.abs(step) / maxStep; // 0..1, how close to max real servo speed this frame
    const instant = Math.min(1, deviation * 0.5 + delta * 1.6 + beat * 0.6);
    hwSim.emitterEnergy[i] = hwSim.emitterEnergy[i] * 0.75 + instant * 0.25;

    // Milestone spark when a channel actually reaches a real extreme (0° or 180°)
    const nearExtreme = angle < HW_SPARK_THRESHOLD_DEG || angle > 180 - HW_SPARK_THRESHOLD_DEG;
    const wasNearExtreme = prevAngle < HW_SPARK_THRESHOLD_DEG || prevAngle > 180 - HW_SPARK_THRESHOLD_DEG;
    if(nearExtreme && !wasNearExtreme) hwSim.sparkT[i] = 0;
    let flash = 0;
    if(hwSim.sparkT[i] >= 0){
      hwSim.sparkT[i] += dt;
      const p = hwSim.sparkT[i] / HW_SPARK_DURATION;
      if(p >= 1) hwSim.sparkT[i] = -1;
      else flash = 1 - p;
    }

    const energy = Math.min(1, hwSim.emitterEnergy[i] * moodMul + flash * 0.8);

    // Marker glow + gentle idle float — real-data brightness, decorative float
    hwSim.markerMats[i].emissiveIntensity = deviation * 0.9 + flash * 1.4;
    const shimmer = 1 + Math.sin(tSec * HW_IDLE_BOB_HZ * Math.PI * 2 + i * 0.5) * HW_IDLE_BOB_AMPLITUDE;
    hwSim.emitterMarkers[i].scale.setScalar((1 + energy * 0.6) * shimmer); // opening ring widens with real activity

    // Continuous respawn scaled by this channel's energy — always some launches even idle, never
    // a fully dead canister (same "no dead zone" principle as the main app's turbulence/speed fix).
    // Gravity bends each particle's straight-up launch into a real ballistic arc.
    for(let p = i * HW_PER_EMITTER_PARTICLES; p < (i + 1) * HW_PER_EMITTER_PARTICLES; p++){
      hwSim.pAge[p] += dt;
      if(hwSim.pAge[p] >= hwSim.pLife[p]) hwSim.respawnParticle(p, energy);
      const lifeT = hwSim.pAge[p] / hwSim.pLife[p];
      hwSim.pVel[p].y -= HW_GRAVITY * dt;
      hwSim.positions[p * 3] += hwSim.pVel[p].x * dt;
      hwSim.positions[p * 3 + 1] += hwSim.pVel[p].y * dt;
      hwSim.positions[p * 3 + 2] += hwSim.pVel[p].z * dt;
      const fade = Math.sin(Math.min(1, lifeT) * Math.PI);
      hwSim.sizesAttr[p] = (1.1 + energy * 2.4) * fade;
    }
  }
  hwSim.geo.attributes.position.needsUpdate = true;
  hwSim.geo.attributes.size.needsUpdate = true;

  hwSim.renderer.render(hwSim.scene, hwSim.camera);
}


function initAudioContext(){
  if(audioEngine.ctx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audioEngine.ctx = new Ctx();
  audioEngine.analyser = audioEngine.ctx.createAnalyser();
  audioEngine.analyser.fftSize = 1024;
  audioEngine.analyser.smoothingTimeConstant = 0.75;
  audioEngine.freqData = new Uint8Array(audioEngine.analyser.frequencyBinCount);
}

function disconnectAudioSource(){
  if(audioEngine.sourceNode){
    try{ audioEngine.sourceNode.disconnect(); }catch(e){}
    audioEngine.sourceNode = null;
  }
  if(audioEngine.micStream){
    audioEngine.micStream.getTracks().forEach(tr => tr.stop());
    audioEngine.micStream = null;
  }
  if(audioEngine.audioEl){
    audioEngine.audioEl.pause();
  }
  audioEngine.active = false;
  if(audioEngine.sourceKind !== 'stems') audioEngine.sourceKind = null;
}

function disconnectStems(){
  STEM_KEYS.forEach(key=>{
    const s = audioEngine.stems[key];
    if(!s) return;
    try{ s.sourceNode && s.sourceNode.disconnect(); }catch(e){}
    s.audioEl.pause();
  });
  audioEngine.stemsActive = false;
  if(audioEngine.sourceKind === 'stems') audioEngine.sourceKind = null;
}

async function loadAudioFile(file){
  initAudioContext();
  if(audioEngine.ctx.state === 'suspended') await audioEngine.ctx.resume();
  disconnectStems();
  disconnectAudioSource();

  if(!audioEngine.audioEl){
    audioEngine.audioEl = new Audio();
    audioEngine.audioEl.loop = true;
    audioEngine.audioEl.crossOrigin = 'anonymous';
  }
  const url = URL.createObjectURL(file);
  audioEngine.audioEl.src = url;

  // A given <audio> element can only have one MediaElementSourceNode ever created for it.
  if(!audioEngine._fileSourceNode){
    audioEngine._fileSourceNode = audioEngine.ctx.createMediaElementSource(audioEngine.audioEl);
  }
  audioEngine._fileSourceNode.connect(audioEngine.analyser);
  audioEngine.analyser.connect(audioEngine.ctx.destination);
  audioEngine.sourceNode = audioEngine._fileSourceNode;
  audioEngine.sourceKind = 'file';
  await audioEngine.audioEl.play();
  audioEngine.active = true;
}

async function startMic(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    initAudioContext();
    if(audioEngine.ctx.state === 'suspended') await audioEngine.ctx.resume();
    disconnectStems();
    disconnectAudioSource();
    audioEngine.micStream = stream;
    const micNode = audioEngine.ctx.createMediaStreamSource(stream);
    micNode.connect(audioEngine.analyser);
    // deliberately not connected to destination — avoids feedback/echo
    audioEngine.sourceNode = micNode;
    audioEngine.sourceKind = 'mic';
    audioEngine.active = true;
  } catch(e){
    toast('Microphone access denied or unavailable');
  }
}

/* --- Stem files (already separated by an external tool — see STEM_KEYS note above) --- */
async function loadStemFile(stemKey, file){
  initAudioContext();
  if(audioEngine.ctx.state === 'suspended') await audioEngine.ctx.resume();
  if(!audioEngine.stemsActive) disconnectAudioSource(); // leaving single/mic mode
  audioEngine.stemsActive = true;
  audioEngine.sourceKind = 'stems';

  let s = audioEngine.stems[stemKey];
  if(!s){
    s = audioEngine.stems[stemKey] = {
      audioEl: new Audio(),
      sourceNode: null,
      analyser: audioEngine.ctx.createAnalyser(),
      freqData: null,
      colEnergy: new Float32Array(GRID_COLS),
      energy: 0,
    };
    s.audioEl.loop = true;
    s.audioEl.crossOrigin = 'anonymous';
    s.analyser.fftSize = 1024;
    s.analyser.smoothingTimeConstant = 0.75;
    s.freqData = new Uint8Array(s.analyser.frequencyBinCount);
  }
  const url = URL.createObjectURL(file);
  s.audioEl.src = url;

  if(!s.sourceNode){
    s.sourceNode = audioEngine.ctx.createMediaElementSource(s.audioEl);
  }
  try{ s.sourceNode.disconnect(); }catch(e){}
  s.sourceNode.connect(s.analyser);
  try{ s.analyser.disconnect(); }catch(e){}
  s.analyser.connect(audioEngine.ctx.destination);

  // roughly align to whatever else is already playing
  const playing = STEM_KEYS.map(k => audioEngine.stems[k]).find(o => o && !o.audioEl.paused);
  if(playing) s.audioEl.currentTime = playing.audioEl.currentTime;

  await s.audioEl.play();
}

function stemsLoadedCount(){
  return STEM_KEYS.reduce((n, k) => n + (audioEngine.stems[k] ? 1 : 0), 0);
}

function toggleStemsPlayback(){
  const loaded = STEM_KEYS.map(k => audioEngine.stems[k]).filter(Boolean);
  if(!loaded.length) return;
  const shouldPlay = loaded[0].audioEl.paused;
  loaded.forEach(s => shouldPlay ? s.audioEl.play() : s.audioEl.pause());
  return shouldPlay;
}

function seekStems(deltaSeconds){
  const loaded = STEM_KEYS.map(k => audioEngine.stems[k]).filter(Boolean);
  loaded.forEach(s => {
    const dur = s.audioEl.duration || Infinity;
    s.audioEl.currentTime = Math.max(0, Math.min(dur, s.audioEl.currentTime + deltaSeconds));
  });
}

function stopStems(){
  const loaded = STEM_KEYS.map(k => audioEngine.stems[k]).filter(Boolean);
  loaded.forEach(s => { s.audioEl.pause(); s.audioEl.currentTime = 0; });
}

/* --- Shared column-energy mapping: log-scaled bin -> grid column, like a real EQ --- */
function accumulateColEnergy(freqData, colEnergyOut, dt){
  const n = freqData.length;
  const minIdx = 1, maxIdx = Math.floor(n * 0.5);
  for(let c = 0; c < GRID_COLS; c++){
    const tt = c / (GRID_COLS - 1);
    const idx = Math.min(maxIdx, Math.floor(minIdx * Math.pow(maxIdx / minIdx, tt)));
    const w = 2;
    let sum = 0, cnt = 0;
    for(let k = Math.max(0, idx - w); k <= Math.min(n - 1, idx + w); k++){ sum += freqData[k]; cnt++; }
    const raw = (sum / cnt) / 255;
    colEnergyOut[c] += (raw - colEnergyOut[c]) * Math.min(1, dt * 10);
  }
}

const HW_STEM_SYNC_CHECK_INTERVAL = 0.5; // seconds between drift checks — correction itself is cheap, but checking every frame isn't needed
const HW_STEM_SYNC_DRIFT_THRESHOLD = 0.08; // 80ms — small enough to catch audible drift, large enough not to over-correct on normal jitter

function updateStemsFrame(dt){
  STEM_KEYS.forEach(key => {
    const s = audioEngine.stems[key];
    if(!s) return;
    s.analyser.getByteFrequencyData(s.freqData);
    let sum = 0;
    for(let i = 0; i < s.freqData.length; i++) sum += s.freqData[i];
    s.energy = (sum / s.freqData.length) / 255;
    accumulateColEnergy(s.freqData, s.colEnergy, dt);
  });

  // Periodic drift correction. Independent <audio> elements aren't locked to a shared clock —
  // they can slowly drift apart during playback even under normal conditions, and drift gets
  // worse if the main thread stalls for any reason (a heavy synchronous task delays each
  // element's own playback scheduling unevenly). Stems were previously only aligned once, at
  // load time; this keeps them within threshold continuously so vocals/drums/bass/other don't
  // audibly separate over the length of a song.
  audioEngine.stemSyncTimer += dt;
  if(audioEngine.stemSyncTimer > HW_STEM_SYNC_CHECK_INTERVAL){
    audioEngine.stemSyncTimer = 0;
    const playing = STEM_KEYS.map((k) => audioEngine.stems[k]).filter((s) => s && !s.audioEl.paused);
    if(playing.length > 1){
      const refTime = playing[0].audioEl.currentTime;
      for(let i = 1; i < playing.length; i++){
        if(Math.abs(playing[i].audioEl.currentTime - refTime) > HW_STEM_SYNC_DRIFT_THRESHOLD){
          playing[i].audioEl.currentTime = refTime;
        }
      }
    }
  }

  // Beat detection off the drums stem when present (best transient signal), else bass.
  const beatSource = audioEngine.stems.drums || audioEngine.stems.bass;
  if(beatSource){
    audioEngine.bassEMA += (beatSource.energy - audioEngine.bassEMA) * 0.06;
    audioEngine.beatCooldown -= dt;
    if(beatSource.energy > audioEngine.bassEMA * 1.35 + 0.06 && audioEngine.beatCooldown <= 0){
      audioEngine.beatPulse = 1.0;
      audioEngine.beatCooldown = 0.16;
    }
  }
  audioEngine.beatPulse *= Math.exp(-dt * 7);
}

function updateAudioFrame(dt){
  if(audioEngine.stemsActive){ updateStemsFrame(dt); return; }
  if(!audioEngine.active || !audioEngine.analyser) return;
  const analyser = audioEngine.analyser, data = audioEngine.freqData;
  analyser.getByteFrequencyData(data);

  // Bass energy drives beat detection (kick/bass tends to carry the beat).
  let bassSum = 0;
  const bassBins = 10;
  for(let k = 2; k < 2 + bassBins; k++) bassSum += data[k];
  const bassEnergy = (bassSum / bassBins) / 255;
  audioEngine.bassEMA += (bassEnergy - audioEngine.bassEMA) * 0.06;
  audioEngine.beatCooldown -= dt;
  if(bassEnergy > audioEngine.bassEMA * 1.35 + 0.06 && audioEngine.beatCooldown <= 0){
    audioEngine.beatPulse = 1.0;
    audioEngine.beatCooldown = 0.16;
  }
  audioEngine.beatPulse *= Math.exp(-dt * 7);

  accumulateColEnergy(data, audioEngine.colEnergy, dt);
}

function initEngineIfNeeded(){
  if(three) { attachRenderer(); return; }
  loadThree();
}

async function loadThree(){
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060708);
  scene.fog = new THREE.Fog(0x060708, 30, 70);

  const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
  camera.position.set(18, 16, 22);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  stage.insertBefore(renderer.domElement, stage.firstChild);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 8;
  controls.maxDistance = 55;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;

  scene.add(new THREE.AmbientLight(0x8899aa, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(12, 20, 10);
  scene.add(key);
  const rim = new THREE.PointLight(0x7dd3fc, 0.8, 60);
  rim.position.set(-14, 8, -12);
  scene.add(rim);
  const fill = new THREE.PointLight(0xffe8c9, 0.4, 60);
  fill.position.set(0, -6, 14);
  scene.add(fill);

  const geo = new THREE.SphereGeometry(0.22, 10, 8);
  const makeMat = (hex) => new THREE.MeshStandardMaterial({ color: hex, metalness: 0.85, roughness: 0.28 });
  // Per-instance vertexColors on InstancedMesh renders near-black in this three.js build
  // (isolated and confirmed: happens even with plain white colors, even on MeshBasicMaterial —
  // not a lighting/color-space issue, the instanced-color path itself is broken here). Instead,
  // each color category gets its own mesh with a normal solid material.color, and every sphere
  // gets written into whichever mesh matches its current category each frame (see tick()).
  const categoryMeshes = { gray: new THREE.InstancedMesh(geo, makeMat(BASE_SPHERE_COLOR), SPHERE_COUNT) };
  STEM_KEYS.forEach(k => { categoryMeshes[k] = new THREE.InstancedMesh(geo, makeMat(STEM_COLORS[k]), SPHERE_COUNT); });
  Object.values(categoryMeshes).forEach(m => {
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.count = 0;
    scene.add(m);
  });

  const dummy = new THREE.Object3D();

  // subtle ground plane for depth reference
  const groundGeo = new THREE.PlaneGeometry(60, 60);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0d, metalness: 0.1, roughness: 0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -6;
  scene.add(ground);

  three = { THREE, scene, camera, renderer, controls, categoryMeshes, dummy, stage };

  buildGrid();
  window.addEventListener('resize', onResize);
  const ro = new ResizeObserver(onResize);
  ro.observe(stage);

  attachControlsSync();
  engine.ready = true;
  resolveTo({ type: 'chaos' });
  requestAnimationFrame(tick);
}

function attachRenderer(){
  const stage = document.getElementById('stage');
  if(three.renderer.domElement.parentElement !== stage){
    stage.insertBefore(three.renderer.domElement, stage.firstChild);
  }
  onResize();
}

function attachControlsSync(){
  const btn = document.getElementById('autoRotateBtn');
  if(btn) btn.textContent = 'Auto-rotate: ' + (engine.autoRotate ? 'on' : 'off');
}

function onResize(){
  if(!three) return;
  const { stage, camera, renderer } = three;
  const w = stage.clientWidth, h = stage.clientHeight;
  if(w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

/* --- Grid positions and per-sphere state --- */
const state = {
  baseX: new Float32Array(SPHERE_COUNT),
  baseZ: new Float32Array(SPHERE_COUNT),
  currentY: new Float32Array(SPHERE_COUNT),
  targetY: new Float32Array(SPHERE_COUNT),
  chaosPhase: new Float32Array(SPHERE_COUNT),
  chaosSeedX: new Float32Array(SPHERE_COUNT),
  chaosSeedZ: new Float32Array(SPHERE_COUNT),
  delay: new Float32Array(SPHERE_COUNT),
  chaosMode: new Uint8Array(SPHERE_COUNT), // 1 = follow live chaos field, 0 = follow fixed targetY
};

function buildGrid(){
  const rand = mulberry32(42);
  const spacing = 0.62;
  const offX = (GRID_COLS - 1) * spacing / 2;
  const offZ = (GRID_ROWS - 1) * spacing / 2;
  let n = 0;
  for(let j = 0; j < GRID_ROWS; j++){
    for(let i = 0; i < GRID_COLS; i++){
      state.baseX[n] = i * spacing - offX;
      state.baseZ[n] = j * spacing - offZ;
      state.currentY[n] = 0;
      state.targetY[n] = 0;
      state.chaosPhase[n] = rand() * Math.PI * 2;
      state.chaosSeedX[n] = rand() * 1000;
      state.chaosSeedZ[n] = rand() * 1000;
      state.delay[n] = rand();
      state.chaosMode[n] = 1;
      n++;
    }
  }
}

/* Cheap value-noise (sum of sines) — good enough for organic drift, no deps. */
function noise2D(x, y, t){
  return (
    Math.sin(x * 1.3 + t * 0.9) * Math.cos(y * 1.1 - t * 0.7) +
    Math.sin(x * 0.6 - y * 0.8 + t * 1.3) * 0.6 +
    Math.sin((x + y) * 0.35 + t * 0.5) * 0.4
  ) / 2.0;
}

/* --- Shape rasterization: draw a target onto an offscreen canvas, sample per grid cell --- */
const rasterCanvas = document.createElement('canvas');
rasterCanvas.width = GRID_COLS * 8;
rasterCanvas.height = GRID_ROWS * 8;
const rasterCtx = rasterCanvas.getContext('2d', { willReadFrequently: true });

function rasterizeText(text){
  const ctx = rasterCtx, W = rasterCanvas.width, H = rasterCanvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let size = H * 0.85;
  ctx.font = `800 ${size}px 'Space Grotesk', Inter, sans-serif`;
  while(ctx.measureText(text).width > W * 0.92 && size > 6){
    size -= 2;
    ctx.font = `800 ${size}px 'Space Grotesk', Inter, sans-serif`;
  }
  ctx.fillText(text, W / 2, H / 2 + size * 0.03);
}

function rasterizePreset(preset){
  const ctx = rasterCtx, W = rasterCanvas.width, H = rasterCanvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';

  if(preset === 'circle'){
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.42, 0, Math.PI * 2);
    ctx.fill();
  } else if(preset === 'car'){
    const midY = H * 0.62;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, midY);
    ctx.lineTo(W * 0.10, H * 0.44);
    ctx.lineTo(W * 0.28, H * 0.30);
    ctx.lineTo(W * 0.60, H * 0.30);
    ctx.lineTo(W * 0.74, H * 0.44);
    ctx.lineTo(W * 0.94, midY);
    ctx.lineTo(W * 0.94, H * 0.72);
    ctx.lineTo(W * 0.06, H * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.24, H * 0.74, H * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.76, H * 0.74, H * 0.11, 0, Math.PI * 2); ctx.fill();
  } else if(preset === 'skyline'){
    const rand = mulberry32(7);
    let x = 0;
    while(x < W){
      const bw = W * (0.05 + rand() * 0.07);
      const bh = H * (0.25 + rand() * 0.6);
      ctx.fillRect(x, H - bh, bw, bh);
      x += bw + W * 0.01;
    }
  } else if(preset === 'blob'){
    const rand = mulberry32(19);
    const cx = W / 2, cy = H / 2, base = Math.min(W, H) * 0.36;
    const pts = 24;
    ctx.beginPath();
    for(let k = 0; k <= pts; k++){
      const a = (k / pts) * Math.PI * 2;
      const r = base * (0.72 + rand() * 0.56);
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.75;
      if(k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }
}

function sampleRasterToTargets(peakHeight){
  const W = rasterCanvas.width, H = rasterCanvas.height;
  const img = rasterCtx.getImageData(0, 0, W, H).data;
  const cellW = W / GRID_COLS, cellH = H / GRID_ROWS;
  let n = 0;
  for(let j = 0; j < GRID_ROWS; j++){
    for(let i = 0; i < GRID_COLS; i++){
      const px = Math.min(W - 1, Math.floor((i + 0.5) * cellW));
      const py = Math.min(H - 1, Math.floor((j + 0.5) * cellH));
      const idx = (py * W + px) * 4;
      const lit = img[idx] > 120;
      state.targetY[n] = lit ? peakHeight : 0;
      state.chaosMode[n] = 0;
      n++;
    }
  }
}

/* --- Public transition entry point --- */
function resolveTo(spec){
  if(!engine.ready) return;
  if(spec.type === 'chaos'){
    for(let n = 0; n < SPHERE_COUNT; n++) state.chaosMode[n] = 1;
    return;
  }
  if(spec.type === 'text') rasterizeText(spec.text);
  else if(spec.type === 'preset') rasterizePreset(spec.preset);
  sampleRasterToTargets(PEAK_HEIGHT);
}

/* --- Ambient auto-loop --- */
function updateAmbient(dt){
  engine.ambientTimer += dt;
  const t = engine.ambientTimer;
  switch(engine.ambientPhase){
    case 'chaos':
      if(t > 4){ engine.ambientPhase = 'resolving'; engine.ambientTimer = 0;
        const p = AMBIENT_PRESETS[engine.ambientPresetIdx % AMBIENT_PRESETS.length];
        engine.ambientPresetIdx++;
        if(p === 'text') resolveTo({ type: 'text', text: 'FORMFIND' });
        else resolveTo({ type: 'preset', preset: p });
      }
      break;
    case 'resolving':
      if(t > 3.5) { engine.ambientPhase = 'hold'; engine.ambientTimer = 0; }
      break;
    case 'hold':
      if(t > 3.5) { engine.ambientPhase = 'unresolving'; engine.ambientTimer = 0; resolveTo({ type: 'chaos' }); }
      break;
    case 'unresolving':
      if(t > 3.5) { engine.ambientPhase = 'chaos'; engine.ambientTimer = 0; }
      break;
  }
}

/* --- Animation loop --- */
let lastT = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if(!three) return;

  updateHwSimulator(now, dt);
  if(engine.mode === 'ambient') updateAmbient(dt * engine.speed);
  if(engine.mode === 'audio') updateAudioFrame(dt);

  const { THREE, categoryMeshes, dummy, camera, renderer, scene, controls } = three;
  const t = now * 0.001 * engine.speed;
  const lerpRate = 1 - Math.pow(0.0025, dt * 3);
  const audioStemsLive = engine.mode === 'audio' && audioEngine.stemsActive;
  const audioSingleLive = engine.mode === 'audio' && audioEngine.active && !audioStemsLive;
  const audioLive = audioStemsLive || audioSingleLive;

  if(audioStemsLive){
    for(let c = 0; c < GRID_COLS; c++){
      let total = 0, domVal = -1, domIdx = 0;
      for(let ki = 0; ki < STEM_KEYS.length; ki++){
        const s = audioEngine.stems[STEM_KEYS[ki]];
        const v = s ? s.colEnergy[c] : 0;
        total += v;
        if(v > domVal){ domVal = v; domIdx = ki; }
      }
      colTotalBuf[c] = total;
      colDominantBuf[c] = domIdx;
    }
  }

  const counters = { gray: 0 };
  STEM_KEYS.forEach(k => { counters[k] = 0; });

  for(let n = 0; n < SPHERE_COUNT; n++){
    let ty;
    const col = n % GRID_COLS;
    if(audioStemsLive){
      const bandHeight = colTotalBuf[col] * PEAK_HEIGHT * engine.turbulence;
      const shimmer = audioEngine.beatPulse * PEAK_HEIGHT * 0.5 * engine.turbulence * (0.5 + 0.5 * noise2D(state.baseX[n], state.baseZ[n], t * 2));
      const idle = noise2D(state.baseX[n] * 0.4, state.baseZ[n] * 0.4, t * 0.5) * 0.15;
      ty = bandHeight * (0.85 + 0.15 * noise2D(state.baseX[n], state.baseZ[n] + col, t * 0.8)) + shimmer + idle;
    } else if(audioSingleLive){
      const bandHeight = audioEngine.colEnergy[col] * PEAK_HEIGHT * engine.turbulence;
      const shimmer = audioEngine.beatPulse * PEAK_HEIGHT * 0.5 * engine.turbulence * (0.5 + 0.5 * noise2D(state.baseX[n], state.baseZ[n], t * 2));
      const idle = noise2D(state.baseX[n] * 0.4, state.baseZ[n] * 0.4, t * 0.5) * 0.15;
      ty = bandHeight * (0.85 + 0.15 * noise2D(state.baseX[n], state.baseZ[n] + col, t * 0.8)) + shimmer + idle;
    } else if(state.chaosMode[n]){
      const fx = state.baseX[n] * 0.35 + state.chaosSeedX[n];
      const fz = state.baseZ[n] * 0.35 + state.chaosSeedZ[n];
      ty = noise2D(fx, fz, t * 0.6) * 1.6 * engine.turbulence;
    } else {
      // Resolved (fixed-target) spheres still get a small live wobble so Speed/Turbulence
      // remain audibly-visibly "doing something" even outside the chaos phase, instead of
      // going inert the instant a shape is held. Scales to zero when turbulence is 0.
      const wobble = noise2D(state.baseX[n] * 0.5, state.baseZ[n] * 0.5, t * 0.8) * 0.15 * engine.turbulence;
      ty = state.targetY[n] + wobble;
    }
    const rate = lerpRate * (0.6 + state.delay[n] * 0.8);
    state.currentY[n] += (ty - state.currentY[n]) * Math.min(1, rate);

    dummy.position.set(state.baseX[n], state.currentY[n], state.baseZ[n]);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();

    // Color category: which bucket-mesh this sphere's transform goes into this frame.
    // Quiet columns (or non-audio modes) stay neutral gray; loud columns take on
    // whichever stem dominates that column's energy right now.
    let category = 'gray';
    if(audioStemsLive && colTotalBuf[col] > 0.05) category = STEM_KEYS[colDominantBuf[col]];

    const targetMesh = categoryMeshes[category];
    targetMesh.setMatrixAt(counters[category], dummy.matrix);
    counters[category]++;
  }

  Object.keys(categoryMeshes).forEach(key => {
    const m = categoryMeshes[key];
    m.count = counters[key];
    m.instanceMatrix.needsUpdate = true;
  });

  controls.autoRotate = engine.autoRotate;
  controls.update();
  renderer.render(scene, camera);
}

        document.getElementById('micStopBtn').style.display = 'none';
        document.getElementById('stemLegend').style.display = 'flex';
        document.getElementById('stemsTransport').style.display = 'flex';
        document.getElementById('stemsPlayPauseBtn').textContent = 'Pause stems';
        updateStemsStatusText();
      } catch(err){
        toast(`Could not load ${STEM_LABELS[key]}`);
      }
    };
  });
  document.getElementById('stemsPlayPauseBtn').onclick = (e)=>{
    const nowPlaying = toggleStemsPlayback();
    if(nowPlaying !== undefined) e.target.textContent = nowPlaying ? 'Pause stems' : 'Play stems';
  };
  document.getElementById('stemsRewindBtn').onclick = ()=>seekStems(-10);
  document.getElementById('stemsForwardBtn').onclick = ()=>seekStems(10);
  document.getElementById('stemsStopBtn').onclick = ()=>{
    stopStems();
    document.getElementById('stemsPlayPauseBtn').textContent = 'Play stems';
  };
  document.getElementById('resolveTextBtn').onclick = ()=>{
    const v = document.getElementById('textInput').value.trim();
    if(!v){ toast('Type something first'); return; }
    resolveTo({ type:'text', text: v.toUpperCase() });
  };
  document.getElementById('scrambleBtn').onclick = ()=>resolveTo({ type:'chaos' });
  document.querySelectorAll('.preset-btn').forEach(b=>{
    b.onclick = ()=>resolveTo({ type:'preset', preset: b.dataset.preset });
  });
  document.getElementById('speedSlider').oninput = (e)=>{
    engine.speed = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = engine.speed.toFixed(1);
  };
  document.getElementById('turbSlider').oninput = (e)=>{
    engine.turbulence = parseFloat(e.target.value);
    document.getElementById('turbVal').textContent = engine.turbulence.toFixed(1);
  };
  document.getElementById('autoRotateBtn').onclick = (e)=>{
    engine.autoRotate = !engine.autoRotate;
    e.target.textContent = 'Auto-rotate: ' + (engine.autoRotate ? 'on' : 'off');
  };

  const STAGE_DEFAULT_POS = [18, 16, 22]; // matches loadThree()'s initial camera.position
  function setStageView(pos){
    if(!three) return; // still loading — buttons work again once it's ready, no error needed
    three.camera.position.set(pos[0], pos[1], pos[2]);
    three.controls.target.set(0, 0, 0);
    three.controls.update();
  }
  document.getElementById('stageRecenterBtn').onclick = ()=> setStageView(STAGE_DEFAULT_POS);
  document.getElementById('stageTopBtn').onclick = ()=> setStageView([0, 30, 0.01]); // tiny Z offset avoids OrbitControls gimbal lock straight down
  document.getElementById('stageSideBtn').onclick = ()=> setStageView([30, 2, 0]);

  updateModeButtons();
  initEngineIfNeeded();
}

function setMode(m){
  const leavingAudio = engine.mode === 'audio' && m !== 'audio';
  engine.mode = m;
  document.getElementById('manualControls').style.display = m === 'manual' ? 'block' : 'none';
  document.getElementById('audioControls').style.display = m === 'audio' ? 'block' : 'none';
  updateModeButtons();
  if(leavingAudio){
    disconnectAudioSource();
    disconnectStems();
    document.getElementById('audioTransport').style.display = 'none';
    document.getElementById('stemsTransport').style.display = 'none';
    document.getElementById('micStopBtn').style.display = 'none';
    document.getElementById('audioStatus').textContent = 'No audio source connected.';
  }
  if(m === 'ambient'){
    engine.ambientTimer = 0;
    engine.ambientPhase = 'chaos';
    resolveTo({ type:'chaos' });
  } else {
    resolveTo({ type:'chaos' });
  }
}
function resetStemsUi(){
  disconnectStems();
  const legend = document.getElementById('stemLegend');
  const ppBtn = document.getElementById('stemsPlayPauseBtn');
  const transport = document.getElementById('stemsTransport');
  const status = document.getElementById('stemsStatus');
  if(legend) legend.style.display = 'none';
  if(ppBtn) ppBtn.style.display = 'none';
  if(transport) transport.style.display = 'none';
  if(status) status.textContent = '';
  document.querySelectorAll('.stem-input').forEach(inp => inp.value = '');
}

function updateStemsStatusText(){
  const status = document.getElementById('stemsStatus');
  if(!status) return;
  const loaded = STEM_KEYS.filter(k => audioEngine.stems[k]).map(k => STEM_LABELS[k]);
  const missing = STEM_KEYS.filter(k => !audioEngine.stems[k]).map(k => STEM_LABELS[k]);
  status.textContent = `Loaded: ${loaded.join(', ')}.` + (missing.length ? ` Not provided: ${missing.join(', ')}.` : '');
}

function updateHardwareUi(){
  const connectBtn = document.getElementById('hwConnectBtn');
  const disconnectBtn = document.getElementById('hwDisconnectBtn');
  if(!connectBtn || !disconnectBtn) return;
  connectBtn.style.display = hardwareEngine.connected ? 'none' : 'inline-flex';
  disconnectBtn.style.display = hardwareEngine.connected ? 'inline-flex' : 'none';
}

function updateModeButtons(){
  const a = document.getElementById('modeAmbient'), m = document.getElementById('modeManual'), u = document.getElementById('modeAudio');
  if(!a || !m || !u) return;
  a.className = 'btn ' + (engine.mode === 'ambient' ? '' : 'secondary');
  m.className = 'btn ' + (engine.mode === 'manual' ? '' : 'secondary');
  u.className = 'btn ' + (engine.mode === 'audio' ? '' : 'secondary');
}

/* ================= Boot ================= */
function applyThemeChrome(){
  document.getElementById('themeColorMeta').setAttribute('content', '#0B0C0E');
}
(function boot(){
  applyThemeChrome();
  document.getElementById('footVersion').innerHTML =
    `FORMFIND · v${APP_VERSION} · Joe.K · <a href="https://axisbim.io" target="_blank" rel="noopener">axisbim.io</a>`;
  document.getElementById('helpBtn').onclick = showHelp;
  render();
})();

</script>
