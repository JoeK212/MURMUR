<!-- Real Slow-4G test (Incognito, extensions/cache excluded) found the eager, every-page-load
     imports below ('three' + OrbitControls, both fetched unconditionally from loadThree()) taking
     20+ seconds — not from payload size, but from the extra DNS+TCP+TLS round trips to spin up a
     connection to a different origin (unpkg) before a single byte of the actual file could move.
     Self-hosting just those two exact specifiers (vendor/, checked in) removes that origin hop
     entirely, since the browser already has a connection open to this page's own origin. The
     lazy, opt-in-only imports (bloom's postprocessing modules, the sim rig's own OrbitControls
     copy — all only fetched if someone checks "Show simulated rig") are left on the "three/addons/"
     CDN prefix on purpose: they're outside the critical path, so the extra origin cost doesn't
     matter there, and self-hosting the whole examples/jsm tree for the sake of two rarely-used
     files isn't worth the repo weight. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "avr8js": "https://cdn.jsdelivr.net/npm/avr8js@0.21.0/+esm"
  }
}
</script>

<script>
const APP_VERSION = '1.39.11'; // keep in sync with CHANGELOG.md top entry and the footer tag below

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ================= Confirm dialog (never native confirm() — see NEW_PROJECT_TEMPLATE.md) ================= */
function confirmDialog(message, confirmLabel = 'OK'){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p>${escapeHtml(message)}</p>
        <div class="confirm-actions">
          <button class="btn secondary" id="confirmCancel">Cancel</button>
          <button class="btn accent" id="confirmOk">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = (result)=>{ overlay.remove(); resolve(result); };
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) cleanup(false); });
    document.getElementById('confirmCancel').onclick = ()=>cleanup(false);
    document.getElementById('confirmOk').onclick = ()=>cleanup(true);
  });
}

function showHelp(){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box" style="max-width:560px; max-height:82vh; overflow-y:auto; text-align:left;">
      <h2 style="font-family:var(--font-display); font-size:19px; margin:0 0 4px;">MURMUR — help</h2>
      <p style="font-size:13px; color:var(--ink-soft); margin:0 0 18px;">A field of kinetic spheres, inspired by ART+COM's BMW Kinetic Sculpture.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Camera</h3>
      <p style="font-size:14px; line-height:1.5; margin:0;">Drag to orbit, scroll to zoom. "Auto-rotate" toggles the slow ambient spin. "Share" (top-right of the 3D view) copies a link that reproduces the current mode, shape, speed, and turbulence — open it fresh to land back on the same look (Audio mode's actual sound can't travel through a link, so a shared audio-mode link just opens to the Audio panel ready for a source). "● Record" captures the 3D view as a downloadable video clip — click again to stop and save.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Ambient loop</h3>
      <p style="font-size:14px; line-height:1.5; margin:0;">Auto-cycles chaos → a shape (text or a preset) → chaos, forever. Speed and Turbulence sliders shape the motion in every mode.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Manual</h3>
      <p style="font-size:14px; line-height:1.5; margin:0;">Type a word (max 12 characters) and click Resolve, or pick a preset — Circle, Car profile, Skyline, Blob. Scramble sends the field back to chaos.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Audio</h3>
      <p style="font-size:14px; line-height:1.5; margin:0 0 8px;">Upload a file or use your microphone. The field becomes a live equalizer — bass on the left, treble on the right — with a beat detector driving a shimmer pulse across the whole grid. Rewind/play-pause/stop/forward controls appear once a source is connected (the mic gets a "Stop microphone" button instead, since there's nothing to seek on a live stream).</p>
      <p style="font-size:14px; line-height:1.5; margin:0;"><strong>Stems:</strong> MURMUR doesn't separate a mixed song itself — that needs a trained model. Easiest is a browser tool: <a href="https://moises.ai" target="_blank" rel="noopener">Moises</a> (recommended — free tier, no install) or <a href="https://www.lalal.ai/stem-splitter/" target="_blank" rel="noopener">LALAL.AI</a>. If you'd rather run it yourself, <a href="https://github.com/facebookresearch/demucs" target="_blank" rel="noopener">Demucs</a> is free and local but command-line. Any of the three works — drag all the separated files onto the dashed drop zone at once (matched by filename — "Vocals", "Drums", etc.) or upload them one at a time with the buttons underneath. Each sphere colors toward whichever stem is loudest at that column right now; the legend shows which color is which. The same transport controls move all loaded stems together, kept in sync — "Solo" next to a stem in the legend isolates just that one to listen to (click again to bring the others back); the others keep playing silently underneath, so nothing drifts out of sync and the visualization keeps reacting to all four regardless of which one's soloed.</p>

      <h3 style="font-size:14px; margin:16px 0 6px;">Physical rig (optional)</h3>
      <p style="font-size:14px; line-height:1.5; margin:0 0 8px;">Drives a real row of hobby servos over WebSerial — Chrome or Edge on desktop only, not supported in Firefox/Safari or on mobile. Whatever's on screen (any mode) gets mirrored to the servos live. Set the servo count to match your build, click Connect Arduino, and pick the port. The paired sketch is <code>murmur_servo/murmur_servo.ino</code> — see the comments at the top of that file for wiring and power notes (servos need their own power supply once you're past 1-2 of them, not the Arduino's 5V/USB). The WebSerial connection itself lives in <code>hardware-bridge.js</code>, a small shared module — the same rig can be driven by other tools in the generative-design-tools suite without re-wiring the connection logic each time.</p>
      <p style="font-size:14px; line-height:1.5; margin:0 0 8px;"><strong>No hardware yet?</strong> Check "Show simulated rig" — it has its own panel, no hardware needed — for a 3D preview: a row of launch canisters firing particles upward, firework-mortar style, launch speed and arc height driven by that servo's real angle. Drag to orbit, scroll to zoom, toggle "Auto-rotate," or snap between side/angled presets — same camera controls as the main stage above. It runs MURMUR's actual compiled firmware directly in this browser tab (avr8js, github.com/wokwi/avr8js — no terminal, no Node.js, no install), each canister's launch measured off real simulated PWM rather than mirrored from on-screen state, then slew-rate-limited to a realistic servo speed (~300°/s) so you can tell if something's moving too fast for real hardware before you build it. If avr8js fails to load (offline, CDN blocked), it falls back to a direct preview automatically rather than breaking. The external <code>avr8js_sim_bridge.js</code> script and its own browser dashboard (<code>http://localhost:8766</code>) still work too, if you want a separate window or a <code>ws://</code> endpoint other tools can connect to — see <code>murmur_servo/AVR8JS_SETUP.md</code>.</p>
      <p style="font-size:14px; line-height:1.5; margin:0;"><strong>Sensor input:</strong> the loop can run the other way too. Wire a potentiometer or photoresistor to the Arduino (see the sketch's comments for wiring), set "Sensor drives" to Turbulence or Speed, and a physical knob or light level controls what's on screen live — the corresponding slider moves to match. Set it to Off to ignore incoming readings.</p>

      <div class="confirm-actions" style="margin-top:20px;">
        <button class="btn accent" id="helpClose">Got it</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cleanup = ()=>overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) cleanup(); });
  document.getElementById('helpClose').onclick = cleanup;
}

/* ================= Helpers ================= */
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================= Three.js sphere-field engine ================= */
const engine = {
  mode: 'ambient',
  speed: 1.0,
  turbulence: 1.0,
  autoRotate: true,
  ambientTimer: 0,
  ambientPhase: 'chaos', // 'chaos' -> 'hold-chaos' -> 'resolving' -> 'hold-shape' -> 'unresolving'
  ambientPresetIdx: 0,
  ready: false,
  manualSpec: null, // last thing explicitly resolved in Manual mode ({type:'text',text} / {type:'preset',preset} / {type:'chaos'}) — used to build a share link
};

const GRID_COLS = 44;
const GRID_ROWS = 22;
const SPHERE_COUNT = GRID_COLS * GRID_ROWS;
const AMBIENT_PRESETS = ['circle','car','skyline','blob','text'];
const MANUAL_PRESET_KEYS = ['circle','car','skyline','blob']; // the actual preset-btn values in Manual mode — AMBIENT_PRESETS also carries the pseudo-preset 'text' (meaning "resolve the word MURMUR"), which isn't a real rasterizePreset() case
const PEAK_HEIGHT = 3.2; // shared resolve/audio height scale, spheres-per-unit-Y

let three = null; // holds { THREE, scene, camera, renderer, controls, categoryMeshes, dummy, ... }

/* ================= Stem coloring =================
   MURMUR does not separate a mixed song itself — that needs a trained model.
   Moises (moises.ai) is the recommended no-install route; Demucs/LALAL.AI also work.
   It accepts up to 4 already-separated stem
   files and colors each sphere by whichever stem is driving its height most. */
const STEM_KEYS = ['vocals', 'drums', 'bass', 'other'];
const STEM_LABELS = { vocals: 'Vocals', drums: 'Drums', bass: 'Bass', other: 'Other / guitar' };
const STEM_COLORS = { vocals: 0xE97452, drums: 0x7DD3FC, bass: 0xB98AFF, other: 0x8CE99A };
const BASE_SPHERE_COLOR = 0xd7dbe0;
const colTotalBuf = new Float32Array(GRID_COLS);
const colDominantBuf = new Int8Array(GRID_COLS);

/* ================= Audio-reactive engine =================
   Beat-driven turbulence + per-column frequency-band shaping (a live equalizer
   mapped across the grid). Works from an uploaded file, the microphone, or up
   to 4 separated stem files (see STEM_KEYS above). */
const audioEngine = {
  ctx: null,
  analyser: null,
  freqData: null,
  sourceNode: null,   // current MediaElementAudioSourceNode or MediaStreamAudioSourceNode
  audioEl: null,
  micStream: null,
  active: false,       // true once a single (file/mic) source is connected and running
  sourceKind: null,    // 'file' | 'mic' | 'stems'
  bassEMA: 0,
  beatPulse: 0,
  beatCooldown: 0,
  colEnergy: new Float32Array(GRID_COLS),
  stemsActive: false,
  stems: { vocals: null, drums: null, bass: null, other: null }, // lazily created per-stem state
  soloedStem: null, // which stem key (if any) is currently isolated — see setStemSolo()
  stemSyncTimer: 0, // periodic drift-correction accumulator — see updateStemsFrame
  level: 0,          // instantaneous 0..1 input level, computed each frame in updateAudioFrame
  levelSmooth: 0,    // eased version, drives the visible meter
  silenceTimer: 0,   // seconds the smoothed level has stayed below the "is anything connected" threshold
};

/* ================= Hardware bridge (WebSerial -> Arduino servos) =================
   Mirrors whatever's currently on screen — ambient, manual, or audio, whatever mode
   is active — to a physical rig of hobby servos, one per evenly-spaced column band.
   Chrome/Edge only (WebSerial isn't in the spec for Firefox/Safari). Protocol and
   firmware: see arduino/murmur_servo/murmur_servo.ino. */
const HW_HEIGHT_MIN = -2, HW_HEIGHT_MAX = 4; // absolute fallback range only — see HW_AGC below for the range actually used
const HW_ANGLE_MIN = 20, HW_ANGLE_MAX = 160; // stay off the 0/180 end-stops
const HW_SEND_INTERVAL_MS = 50; // ~20Hz — plenty for visible motion, easy on the Uno's serial buffer
// Auto-gain per band: a fixed height->angle window (above) meant most songs/sections only ever
// filled a narrow slice of it, so the real signal barely moved the arms even though the audio
// underneath was genuinely dynamic — this was the actual cause of the rig looking "stagnant",
// not a lack of decoration. Each band tracks its own recent min/max and maps against THAT,
// so a quiet verse and a loud chorus both use the full angle swing, and a change in the real
// per-band average height still reads as a real angle change either way.
let hwAgcMin = null, hwAgcMax = null; // lazily sized to servoCount in computeServoAngles
const HW_AGC_RISE = 0.35, HW_AGC_FALL_PER_SEC = 0.55; // peaks/floors track fast up, relax slowly back
let hwAgcLastT = null; // computeServoAngles is called both from rAF (3D preview) and hardware-bridge.js's own interval (real hardware) — self-timed so it works from either
const hardwareEngine = {
  connected: false,
  servoCount: 8,
  simulate: false,   // 3D rig preview — lets you verify the mapping/timing/motion speed with no Arduino attached
  sensorTarget: 'off', // 'off' | 'turbulence' | 'speed' — what an incoming sensor reading drives
  sensorLastRaw: null, // last analogRead() value received, 0-1023
};

function mapRange(v, inMin, inMax, outMin, outMax){
  const t = (v - inMin) / (inMax - inMin);
  return outMin + Math.max(0, Math.min(1, t)) * (outMax - outMin);
}

/* Connect/disconnect, the send loop, and the sensor read loop all live in
   shared/hardware-bridge.js now — pulled out so any of the other generative-
   design-tools can drive the same physical rig without re-implementing the
   WebSerial plumbing. MURMUR supplies its own getAngles/onSensorReading;
   everything else is generic. Dynamically imported, same pattern as three.js
   below, since this script isn't itself a module. */
let hwBridge = null;
async function ensureHwBridge(){
  if(hwBridge) return hwBridge;
  const { createHardwareBridge } = await import('./hardware-bridge.js');
  hwBridge = createHardwareBridge({
    getAngles: computeServoAngles,
    onSensorReading: (norm, raw) => {
      hardwareEngine.sensorLastRaw = raw;
      applySensorReading(norm);
      const status = document.getElementById('hwSensorStatus');
      if(status) status.textContent = `Sensor: ${raw}/1023 (${norm.toFixed(2)})`;
    },
    onStatusChange: (status, message) => {
      hardwareEngine.connected = (status === 'connected');
      updateHardwareUi();
      const statusEl = document.getElementById('hwStatus');
      if(statusEl){
        if(status === 'connected') statusEl.textContent = `Connected — driving ${hardwareEngine.servoCount} servo(s).`;
        else if(status === 'disconnected') statusEl.textContent = 'Not connected.';
        else if(status === 'error' && message) statusEl.textContent = message;
      }
      if(status === 'error' && message) toast(message);
    },
    sendIntervalMs: HW_SEND_INTERVAL_MS,
  });
  return hwBridge;
}

let wokwiWsBridge = null;
async function ensureWokwiWsBridge(url){
  const { createWebSocketBridge } = await import('./hardware-bridge.js');
  // Rebuild if the URL changed since last connect — createWebSocketBridge bakes the URL in at creation.
  if(wokwiWsBridge && wokwiWsBridge._url === url) return wokwiWsBridge;
  wokwiWsBridge = createWebSocketBridge({
    url,
    getAngles: computeServoAngles,
    onSensorReading: (norm, raw) => {
      hardwareEngine.sensorLastRaw = raw;
      applySensorReading(norm);
      const status = document.getElementById('hwSensorStatus');
      if(status) status.textContent = `Sensor: ${raw}/1023 (${norm.toFixed(2)})`;
    },
    onStatusChange: (status, message) => {
      const connectBtn = document.getElementById('wokwiWsConnectBtn');
      const disconnectBtn = document.getElementById('wokwiWsDisconnectBtn');
      const statusEl = document.getElementById('wokwiWsStatus');
      if(connectBtn) connectBtn.style.display = status === 'connected' ? 'none' : 'inline-flex';
      if(disconnectBtn) disconnectBtn.style.display = status === 'connected' ? 'inline-flex' : 'none';
      if(statusEl){
        if(status === 'connected') statusEl.textContent = `Connected — driving ${hardwareEngine.servoCount} servo(s) via simulator bridge.`;
        else if(status === 'disconnected') statusEl.textContent = 'Not connected.';
        else if(status === 'error' && message) statusEl.textContent = message;
      }
      if(status === 'error' && message) toast(message);
    },
    sendIntervalMs: HW_SEND_INTERVAL_MS,
  });
  wokwiWsBridge._url = url;
  return wokwiWsBridge;
}

function applySensorReading(norm){
  if(hardwareEngine.sensorTarget === 'turbulence'){
    engine.turbulence = mapRange(norm, 0, 1, 0, 2);
    const slider = document.getElementById('turbSlider'), val = document.getElementById('turbVal');
    if(slider){ slider.value = engine.turbulence; }
    if(val){ val.textContent = engine.turbulence.toFixed(1); }
  } else if(hardwareEngine.sensorTarget === 'speed'){
    engine.speed = mapRange(norm, 0, 1, 0.2, 2.5);
    const slider = document.getElementById('speedSlider'), val = document.getElementById('speedVal');
    if(slider){ slider.value = engine.speed; }
    if(val){ val.textContent = engine.speed.toFixed(1); }
  }
}

   Runs murmur_servo.ino's REAL compiled firmware directly in this browser
   tab via avr8js (github.com/wokwi/avr8js, MIT — the same open-source AVR
   core that powers Wokwi itself, which runs entirely client-side). No
   Node.js, no terminal, no npm install — this is the exact same simulation
   murmur_servo/avr8js_sim_bridge.js does from a terminal (same hex, same
   CPU/peripheral setup, same PWM-pulse decode), just running inside this
   page instead. That external script + its own live dashboard still work
   and remain useful (a separate window, a shareable ws:// endpoint for
   other tools) — this doesn't replace them, it just means checking "Show
   simulated rig" needs nothing else running.
   Loaded from a CDN (jsdelivr) at runtime, not bundled — if that fails
   (offline, CDN blocked), this falls back to the direct angle-mirror
   preview MURMUR always had, rather than breaking outright. */
/* ================= Embedded avr8js firmware simulation (Web Worker) =================
   Runs murmur_servo.ino's REAL compiled firmware inside avr8js
   (github.com/wokwi/avr8js, MIT — the same open-source AVR core that powers
   Wokwi itself). Executes in a dedicated Web Worker, not the main thread —
   the raw AVR instruction-stepping loop is real per-cycle CPU emulation and
   was measurably heavy enough running on the main thread to compete with
   the kinetic-sculpture render loop and with <audio> element scheduling
   (reported as general sluggishness plus audible stem drift). Isolating it
   in a worker means the main thread's per-frame cost for this feature is
   just reading a small array — the actual simulation work no longer
   competes with rendering or audio at all.
   This is the exact same simulation murmur_servo/avr8js_sim_bridge.js
   does from a terminal (same hex, same CPU/peripheral setup, same PWM-pulse
   decode) — that external script + its own dashboard still work too, for a
   separate window or a shareable ws:// endpoint.
   avr8js itself loads from a CDN inside the worker at runtime (not via the
   page's import map — worker-scoped import map support is inconsistent
   across browsers, so the worker uses the full CDN URL directly). If that
   fails (offline, CDN blocked), the preview falls back to the direct
   angle-mirror behavior MURMUR always had, rather than breaking. */

const HW_FIRMWARE_WORKER_SRC = `
let cpu = null, avrInstruction = null, usart = null, adc = null;
const decodedAngles = new Float64Array(8).fill(90);
let rxQueue = [];
const SERVO_PIN_MAP = [
  { port: 'D', bit: 2 }, { port: 'D', bit: 3 }, { port: 'D', bit: 4 }, { port: 'D', bit: 5 },
  { port: 'D', bit: 6 }, { port: 'D', bit: 7 }, { port: 'B', bit: 0 }, { port: 'B', bit: 1 },
];
const MIN_PULSE_US = 544, MAX_PULSE_US = 2400;
const riseCycle = { D: new Array(8).fill(null), B: new Array(8).fill(null) };

function loadIntelHex(source, target){
  for(const line of source.split('\\n')){
    if(line[0] === ':' && line.substr(7, 2) === '00'){
      const bytes = parseInt(line.substr(1, 2), 16);
      const addr = parseInt(line.substr(3, 4), 16);
      for(let i = 0; i < bytes; i++) target[addr + i] = parseInt(line.substr(9 + i * 2, 2), 16);
    }
  }
}

function handlePortEdges(port, value, oldValue){
  const changed = value ^ oldValue;
  for(let bit = 0; bit < 8; bit++){
    if(!((changed >> bit) & 1)) continue;
    const isHigh = !!((value >> bit) & 1);
    if(isHigh){
      riseCycle[port][bit] = cpu.cycles;
    } else if(riseCycle[port][bit] !== null){
      const pulseUs = (cpu.cycles - riseCycle[port][bit]) / 16;
      riseCycle[port][bit] = null;
      const idx = SERVO_PIN_MAP.findIndex((m) => m.port === port && m.bit === bit);
      if(idx !== -1 && pulseUs > 300 && pulseUs < 3000){
        decodedAngles[idx] = Math.max(0, Math.min(180, ((pulseUs - MIN_PULSE_US) / (MAX_PULSE_US - MIN_PULSE_US)) * 180));
      }
    }
  }
}

let ready = false;
const SUBSTEP_CYCLES = 200, MAX_CATCHUP_SEC = 0.01, MHZ = 16e6;
// MAX_CATCHUP_SEC was 0.25 — that let a single tick() call try to simulate up to 4,000,000 AVR
// instructions in a row before returning. Confirmed live (via Claude in Chrome, injecting a
// debug-introspection build of this exact source into a fresh isolated Worker) that this JS AVR
// emulation cannot actually execute that many instructions in anything close to real time inside
// a Worker: rxQueue was observed GROWING over real seconds even while usart.rxBusy sat false the
// whole time, meaning tick() itself was only getting called roughly once every 400-600ms (each
// call busy simulating its full catch-up allowance), not the intended ~4ms — so a queued serial
// command line could take the better part of a minute to fully arrive, decoded servo angles
// barely budged from their power-on 90° default, and the fireworks preview looked frozen
// regardless of how much the real sphere field was actually doing. Cutting the per-call catch-up
// allowance to 0.01s (25x smaller) makes each tick() call cheap enough to actually return
// promptly, so setInterval(tick, 4) gets much closer to its real cadence and the byte-feed inside
// the substep loop below gets far more real opportunities per second — confirmed live: with this
// change, a full 8-servo command line drains from the queue and decodes correctly within ~1
// second instead of never completing. (Tried moving the byte-feed check outside the substep loop
// first, as a cleverer-looking fix — confirmed live that this was actually a regression: it cut
// per-call feed opportunities from "many, once per substep" down to "one, no matter how many
// substeps ran," which is worse the smaller MAX_CATCHUP_SEC gets. Left the feed check exactly
// where it originally was, inside the loop; the real fix is just this constant.)
let startWall = null;
let postCounter = 0;
const POST_EVERY_N_TICKS = 12; // tick runs every 4ms internally; post decoded angles back roughly every ~48ms (~20Hz), not every tick

function tick(){
  const elapsedSec = (performance.now() - startWall) / 1000;
  let targetCycles = Math.floor(elapsedSec * MHZ);
  if(targetCycles - cpu.cycles > MAX_CATCHUP_SEC * MHZ) targetCycles = cpu.cycles + MAX_CATCHUP_SEC * MHZ;
  while(cpu.cycles < targetCycles){
    const stepTarget = Math.min(targetCycles, cpu.cycles + SUBSTEP_CYCLES);
    while(cpu.cycles < stepTarget){ avrInstruction(cpu); cpu.tick(); }
    if(rxQueue.length && !usart.rxBusy) usart.writeByte(rxQueue.shift());
  }
  const sensorPhase = (cpu.cycles / MHZ) % 12;
  const p = sensorPhase < 6 ? sensorPhase / 6 : (12 - sensorPhase) / 6;
  adc.channelValues[0] = p * 5;

  postCounter++;
  if(postCounter >= POST_EVERY_N_TICKS){
    postCounter = 0;
    self.postMessage({ type: 'angles', angles: Array.from(decodedAngles) });
  }
}

self.onmessage = async (e) => {
  const msg = e.data;
  if(msg.type === 'init'){
    try {
      const avr = await import('https://cdn.jsdelivr.net/npm/avr8js@0.21.0/+esm');
      const { CPU, avrInstruction: avrInstr, AVRIOPort, AVRTimer, AVRUSART, AVRADC,
              portBConfig, portCConfig, portDConfig,
              timer0Config, timer1Config, timer2Config,
              usart0Config, adcConfig } = avr;
      avrInstruction = avrInstr;
      const program = new Uint16Array(0x8000);
      loadIntelHex(msg.hex, new Uint8Array(program.buffer));
      cpu = new CPU(program);
      new AVRTimer(cpu, timer0Config);
      new AVRTimer(cpu, timer1Config);
      new AVRTimer(cpu, timer2Config);
      const portB = new AVRIOPort(cpu, portBConfig);
      new AVRIOPort(cpu, portCConfig);
      const portD = new AVRIOPort(cpu, portDConfig);
      usart = new AVRUSART(cpu, usart0Config, MHZ);
      adc = new AVRADC(cpu, adcConfig);
      adc.avcc = 5;
      portD.addListener((v, o) => handlePortEdges('D', v, o));
      portB.addListener((v, o) => handlePortEdges('B', v, o));
      ready = true;
      startWall = performance.now();
      setInterval(tick, 4);
      self.postMessage({ type: 'ready' });
    } catch(err){
      self.postMessage({ type: 'failed', message: String((err && err.message) || err) });
    }
  } else if(msg.type === 'command'){
    if(!ready) return;
    const line = 'A' + msg.angles.map((a) => Math.round(a)).join(',') + '\\n';
    for(const ch of line) rxQueue.push(ch.charCodeAt(0) & 0xff);
  }
};
`;

function computeServoAngles(){
  const n = hardwareEngine.servoCount;
  const bandWidth = GRID_COLS / n;
  const sums = new Float32Array(n);
  const counts = new Int32Array(n);
  for(let i = 0; i < SPHERE_COUNT; i++){
    const col = i % GRID_COLS;
    const band = Math.min(n - 1, Math.floor(col / bandWidth));
    sums[band] += state.currentY[i];
    counts[band]++;
  }

  const now = performance.now();
  const dt = hwAgcLastT === null ? 0.016 : Math.min(0.25, (now - hwAgcLastT) / 1000);
  hwAgcLastT = now;
  if(!hwAgcMin || hwAgcMin.length !== n){
    hwAgcMin = new Float32Array(n).fill(HW_HEIGHT_MIN);
    hwAgcMax = new Float32Array(n).fill(HW_HEIGHT_MAX);
  }
  const fallStep = HW_AGC_FALL_PER_SEC * dt;

  const angles = new Array(n);
  for(let b = 0; b < n; b++){
    const avg = counts[b] ? sums[b] / counts[b] : 0;

    // Auto-gain: each band's own recent floor/ceiling, not a fixed absolute range — this is what
    // actually fixed the "stagnant" look, since the real per-band signal now uses its full swing
    // regardless of whether the current section (or mode) is quiet or loud.
    if(avg > hwAgcMax[b]) hwAgcMax[b] += (avg - hwAgcMax[b]) * HW_AGC_RISE;
    else hwAgcMax[b] = Math.max(avg, hwAgcMax[b] - fallStep);
    if(avg < hwAgcMin[b]) hwAgcMin[b] += (avg - hwAgcMin[b]) * HW_AGC_RISE;
    else hwAgcMin[b] = Math.min(avg, hwAgcMin[b] + fallStep);

    // Window is centered on the tracked range's own midpoint, not anchored at hwAgcMin. With the
    // old `mapRange(avg, hwAgcMin, hwAgcMin+span, ...)` anchoring, once the signal goes truly flat
    // (silence, or idle with no wobble left post-v1.39.0) both bounds converge onto avg and the
    // 0.5 floor below then pinned avg to the very BOTTOM of the substituted window every time —
    // mapping flat/silent input to HW_ANGLE_MIN (a full-scale extreme, deviation~0.78) forever,
    // never to neutral 90. That's the root of "rig shows activity with nothing playing": AGC
    // silence didn't mean "angle at rest," it meant "angle locked at an extreme." Centering the
    // substituted window on the range's midpoint instead means a converged/flat avg sits at the
    // window's center → maps to 90 (true neutral, zero deviation) — while leaving every non-flat,
    // real-dynamic-range case identical to before (mid ± span/2 == hwAgcMin..hwAgcMax exactly when
    // span isn't floored).
    const mid = (hwAgcMin[b] + hwAgcMax[b]) / 2;
    const span = Math.max(0.5, hwAgcMax[b] - hwAgcMin[b]); // floor on span so near-silence doesn't get amplified into noise
    angles[b] = Math.round(mapRange(avg, mid - span / 2, mid + span / 2, HW_ANGLE_MIN, HW_ANGLE_MAX));
  }
  return angles;
}
