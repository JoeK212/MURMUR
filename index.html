}
function attachHwControlsIfReady(){
  if(!hwSim || hwSim.controls || hwControlsState !== 'ready') return;
  const controls = new hwOrbitControlsClass(hwSim.camera, hwSim.renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = hwSimAutoRotate;
  controls.autoRotateSpeed = 1.1;
  controls.target.set(0, 1.7, 0); // matches the look-at height setHwSimView already uses
  controls.minDistance = 2;
  controls.maxDistance = hwSim.fitDist * 2.5;
  controls.update();
  hwSim.controls = controls;
}

function hwPseudoRandom(seed){ // deterministic per-index "randomness" so re-running doesn't reshuffle character variation
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

function hwSpriteTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.42)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.16)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return c;
}

function ensureHwSimScene(){
  if(!three || !three.THREE) return false; // main engine not loaded yet
  const container = document.getElementById('hwSimViewport');
  if(!container) return false;
  if(hwSim && hwSim.count === HW_FIRMWARE_SERVO_COUNT){
    attachHwBloomIfReady(); // lazy-attach once the async postprocessing modules land — no-op if already attached or not ready yet
    attachHwControlsIfReady(); // same for OrbitControls
    return true; // always 8 now — mirrors the real compiled sketch, not the "servo count" field (see resampleToFirmwareServoCount)
  }

  const THREE = three.THREE;
  if(hwSim){
    hwSim.renderer.dispose();
    container.innerHTML = '';
  }

  const w = container.clientWidth || 400, h = 360; // taller now that bursts launch upward like fireworks and need real headroom, not just a strip
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060708);
  scene.fog = new THREE.Fog(0x060708, 8, 22);

  const n = HW_FIRMWARE_SERVO_COUNT; // always 8 — the on-screen preview mirrors the real compiled sketch's fixed pin count
  const spacing = 1.6; // more room between canisters so individual launches read as separate, not one fused mass
  const totalWidth = (n - 1) * spacing;
  const requiredHeight = 6.5; // tall enough to frame a full launch-arc-fade arc, not just a strip at ground level
  const requiredWidth = totalWidth + 3.0; // room for lateral scatter on launch
  const aspect = w / h;

  // Perspective, not orthographic — reads as genuinely 3D (matches the main kinetic-sculpture
  // stage's own camera) instead of the flat/pancake look an orthographic projection gives a row
  // of 3D content. Distance is fit to the content once here and reused for both view modes in
  // setHwSimView, with a margin generous enough that rotating to the angled azimuth doesn't push
  // anything outside the frustum.
  const FOV_DEG = 45;
  const vFov = THREE.MathUtils.degToRad(FOV_DEG);
  const distForHeight = (requiredHeight / 2) / Math.tan(vFov / 2);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const distForWidth = (requiredWidth / 2) / Math.tan(hFov / 2);
  const fitDist = Math.max(distForHeight, distForWidth) * 1.35; // margin covers the angled-view azimuth safely

  const camera = new THREE.PerspectiveCamera(FOV_DEG, aspect, 0.1, 60);

  scene.add(new THREE.AmbientLight(0x8899aa, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 0.5);
  key.position.set(3, 5, 6);
  scene.add(key);
  // Warm fill light grazing the ground plane below — same technique the main stage uses to turn
  // an otherwise-flat dark floor into the soft lit gradient visible under the sphere field, added
  // here so the two frames read as the same visual world instead of one lit and one pitch-black.
  const fill = new THREE.PointLight(0xffe8c9, 0.35, 26);
  fill.position.set(0, -1.5, requiredWidth * 0.35);
  scene.add(fill);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  // No tone mapping was set here before, so overlapping additive sprites just clipped every
  // channel straight to 1.0 the moment a few bursts overlapped — reads as a blown-out white
  // blob instead of distinct colored bursts, worse the busier the audio gets. ACES compresses
  // the highlights instead of hard-clipping, so color survives even where several bursts overlap.
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.32;
  // v1.28.0's halving still wasn't enough under real, dense audio (many/most channels energetic
  // simultaneously, arcs overlapping into one mass) — this isn't really a single-knob problem:
  // additive stacking of enough overlapping sprites trends toward white under ANY tone-mapping
  // curve as local luminance climbs, exposure just shifts where that happens. Cut hard across
  // every contributing layer this time instead of nudging one.
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  // Ground plane — was a thin 0.4-unit-deep unlit strip right under the canisters, easy to miss
  // against the dark background/fog. Replaced with a real floor (same technique the main stage
  // uses: a big matte MeshStandardMaterial plane, lit rather than a flat unlit color) so it reads
  // as an actual ground the row sits on, not just a sliver.
  //
  // v1.32.0 copied the main stage's exact ground color (0x0a0b0d) verbatim, but the main stage
  // has no tone mapping at all, while this scene's exposure was cut hard (down to 0.32 across
  // several rounds) to fix the particle white-blowout — the identical material renders at roughly
  // a third the brightness here. Tried `material.toneMapped = false` to decouple it from that
  // exposure entirely — confirmed LIVE, via Claude in Chrome, that this does NOT actually work in
  // this renderer/three.js combination: sampling the rendered pixel color directly (gl.readPixels)
  // while sweeping toneMappingExposure showed the "detached" material's brightness still tracking
  // exposure exactly like everything else. Rather than fight that, embraced it: emissiveIntensity
  // tuned live against the REAL exposure (0.32) until the color sampled correctly, landing on 5.0.
  // This means the ground genuinely is coupled to exposure — if that number moves again for the
  // particle system, re-check this value the same way (sample a pixel, don't just eyeball it).
  const groundSize = Math.max(requiredWidth, requiredHeight) * 2.2;
  const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x14161a, metalness: 0.15, roughness: 0.9,
    emissive: 0x22262e, emissiveIntensity: 5.0,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.02;
  scene.add(ground);

  // Launch canisters — a short dark tube sunk into the ground strip per servo, with a glowing
  // opening ring at the mouth (the one real-data-driven part: brightness tracks that channel's
  // real angle deviation, same role the old floating marker played). Particles now spawn from
  // the mouth and launch upward like a firework mortar instead of bursting outward from a
  // floating point in mid-air.
  const canisterGeo = new THREE.CylinderGeometry(0.1, 0.13, HW_CANISTER_H, 14);
  canisterGeo.translate(0, HW_CANISTER_H / 2, 0); // pivot at the base so it sits flush on the ground
  const canisterMat = new THREE.MeshStandardMaterial({ color: 0x1c1e23, metalness: 0.6, roughness: 0.5 });
  const voidGeo = new THREE.CircleGeometry(0.075, 16);
  const voidMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const ringGeo = new THREE.RingGeometry(0.06, 0.105, 22);

  const emitterPositions = [];
  const emitterMarkers = []; // the glowing opening ring per canister — same "marker" role as before
  const markerMats = [];
  for(let i = 0; i < n; i++){
    const x = i * spacing - totalWidth / 2;
    emitterPositions.push(new THREE.Vector3(x, HW_CANISTER_H, 0));

    const canister = new THREE.Mesh(canisterGeo, canisterMat);
    canister.position.set(x, 0, 0);
    scene.add(canister);

    const voidDisc = new THREE.Mesh(voidGeo, voidMat); // suggests a hollow bore, not a solid cap
    voidDisc.rotation.x = -Math.PI / 2;
    voidDisc.position.set(x, HW_CANISTER_H - 0.03, 0);
    scene.add(voidDisc);

    const rnd = hwPseudoRandom(i * 7.3); // 0..1, deterministic per emitter — individuality, not per-frame noise
    const markerColor = new THREE.Color(BASE_SPHERE_COLOR).offsetHSL((rnd - 0.5) * 0.08, 0, 0);
    const markerMat = new THREE.MeshStandardMaterial({ color: markerColor, metalness: 0.4, roughness: 0.4, emissive: markerColor, emissiveIntensity: 0, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, markerMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, HW_CANISTER_H + 0.006, 0);
    scene.add(ring);

    emitterMarkers.push(ring);
    markerMats.push(markerMat);
  }

  const spriteTex = new THREE.CanvasTexture(hwSpriteTexture());

  // Particle burst system — additive sprites, custom shader for per-particle size (see
  // avr8js_sim_bridge.js's dashboard for the same technique; safe to use a plain template-literal
  // shader string here since, unlike that file, this code isn't itself embedded inside an outer
  // template literal — no double-escaping risk).
  //
  // Buffer layout: indices [0, total) are real, physically-simulated "lead" particles. Indices
  // [total, total*(1+trailCount)) are comet-tail echoes — not independently simulated, they just
  // ease toward their lead's current position each frame (see updateHwSimulator), so the trail is
  // a smoothed rendering of the same real motion, not a second data source.
  const total = n * HW_PER_EMITTER_PARTICLES;
  const trailCount = HW_TRAIL_LAG.length;
  const totalAll = total * (1 + trailCount);
  const positions = new Float32Array(totalAll * 3);
  const colorsAttr = new Float32Array(totalAll * 3);
  const sizesAttr = new Float32Array(totalAll);
  const pVel = [];
  const pAge = new Float32Array(total);
  const pLife = new Float32Array(total);
  const pEmitter = new Uint16Array(total);
  const pWasRising = new Uint8Array(total).fill(1); // for apex-burst detection: was this particle still ascending last frame?
  const pPopT = new Float32Array(total).fill(-1); // -1 = not currently popping; counts up through HW_POP_DURATION once an apex is crossed

  function hueForEmitter(i){ return 0.52 + (i / n) * 0.32; }

  function respawnParticle(p, energy){
    const e = pEmitter[p];
    const origin = emitterPositions[e];
    positions[p * 3] = origin.x;
    positions[p * 3 + 1] = origin.y;
    positions[p * 3 + 2] = origin.z;
    // Launch mostly straight up, like a mortar shot — energy sets how hard it fires, gravity
    // (applied per-frame in updateHwSimulator) bends the flight into a real arc rather than a
    // radial burst. Small lateral scatter so it doesn't look like a single ruler-straight line.
    // No baseline anymore — per user request, a genuinely idle channel (energy 0) launches
    // nothing at all. But a plain linear scale from 0 made moderate real energy (~0.3-0.4, which
    // turned out to be the typical range during real Ambient/Audio activity) look nearly invisible
    // at normal viewing scale — confirmed live via a full-canvas pixel scan: particles genuinely
    // were rendering, just too small/sparse to read as "alive." Switched to a sqrt curve: still
    // exactly 0 at energy 0, but rises much faster at low-to-moderate energy (sqrt(0.4)≈0.63) so
    // real activity reads clearly without needing to peg near 1.0 first.
    const vis = Math.sqrt(energy);
    const spread = vis * 0.9;
    const vx = (Math.random() - 0.5) * spread;
    const vz = (Math.random() - 0.5) * spread;
    const vy = vis * 6.2;
    pVel[p] = new THREE.Vector3(vx, vy, vz);
    pAge[p] = 0;
    pLife[p] = 0.7 + Math.random() * 0.9; // fades mid-arc/near-apex, the way real shell sparks burn out
    sizesAttr[p] = 0;
    pWasRising[p] = 1;
    pPopT[p] = -1;
    // Snap this particle's trail echoes back to the same launch point too, so a respawn doesn't
    // leave a long streak connecting the old apex to the new launch.
    for(let k = 0; k < trailCount; k++){
      const echoIdx = total + k * total + p;
      positions[echoIdx * 3] = origin.x;
      positions[echoIdx * 3 + 1] = origin.y;
      positions[echoIdx * 3 + 2] = origin.z;
      sizesAttr[echoIdx] = 0;
    }
  }

  for(let p = 0; p < total; p++){
    pEmitter[p] = Math.floor(p / HW_PER_EMITTER_PARTICLES);
    const c = new THREE.Color().setHSL(hueForEmitter(pEmitter[p]), 0.85, 0.62);
    colorsAttr[p * 3] = c.r; colorsAttr[p * 3 + 1] = c.g; colorsAttr[p * 3 + 2] = c.b;
    for(let k = 0; k < trailCount; k++){
      const echoIdx = total + k * total + p;
      colorsAttr[echoIdx * 3] = c.r; colorsAttr[echoIdx * 3 + 1] = c.g; colorsAttr[echoIdx * 3 + 2] = c.b;
    }
    respawnParticle(p, 0);
    pAge[p] = Math.random() * pLife[p]; // desync initial bursts
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colorsAttr, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizesAttr, 1));

  const particleMat = new THREE.ShaderMaterial({
    uniforms: { map: { value: spriteTex }, dim: { value: 1.0 } },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      varying vec3 vColor;
      void main(){
        vColor = color;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (185.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      precision mediump float;
      uniform sampler2D map;
      uniform float dim;
      varying vec3 vColor;
      void main(){
        vec4 tex = texture2D(map, gl_PointCoord);
        gl_FragColor = vec4(vColor, 1.0) * tex * dim;
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const points = new THREE.Points(geo, particleMat);
  scene.add(points);

  const prevAngles = hwSim ? hwSim.currentAngles : null;
  const currentAngles = new Float32Array(n).fill(90);
  if(prevAngles) currentAngles.set(prevAngles.subarray(0, Math.min(n, prevAngles.length)));

  hwSim = {
    THREE, scene, camera, renderer, container, fitDist,
    emitterMarkers, markerMats, emitterPositions,
    positions, colorsAttr, sizesAttr, pVel, pAge, pLife, pEmitter, pWasRising, pPopT, respawnParticle, geo, points,
    total, trailCount,
    emitterEnergy: new Float32Array(n),
    sparkT: new Float32Array(n).fill(-1), // -1 = not currently sparking
    count: n, currentAngles, totalWidth, viewMode: (hwSim ? hwSim.viewMode : 'side'),
    composer: null, bloomPass: null,
    controls: null, // attached lazily by attachHwControlsIfReady once the async module lands
  };
  setHwSimView(hwSim.viewMode);
  attachHwBloomIfReady(); // in case the async modules already finished loading by the time we got here
  attachHwControlsIfReady();
  return true;
}

function setHwSimView(mode){
  if(!hwSim) return;
  hwSim.viewMode = mode;
  const THREE = hwSim.THREE, d = hwSim.fitDist, targetY = 1.7; // raised from the old 1.0 — launches now arc well above the row, so the camera needs to look further up the column, not just at ground-row height
  if(mode === 'angle'){
    const az = THREE.MathUtils.degToRad(34), el = THREE.MathUtils.degToRad(14);
    const horizR = d * Math.cos(el);
    hwSim.camera.position.set(horizR * Math.sin(az), targetY + d * Math.sin(el), horizR * Math.cos(az));
  } else {
    hwSim.camera.position.set(0, targetY, d);
  }
  hwSim.camera.lookAt(0, targetY, 0);
  if(hwSim.controls){
    // Once OrbitControls is attached, it owns the camera each frame — resync its target/spherical
    // state to this preset too, or the next update() would just pull the camera back to wherever
    // the user last dragged it, silently undoing the button.
    hwSim.controls.target.set(0, targetY, 0);
    hwSim.controls.update();
  }
}

function updateHwSimulator(now, dt){
  if(!hardwareEngine.simulate) return;
  if(!ensureHwSimScene()) return;
  if(hwPostFXState === 'idle') ensureHwPostFX(); // fire-and-forget; only kicks off once
  if(hwControlsState === 'idle') ensureHwOrbitControlsModule();

  // Command angles come from the same computeServoAngles() real/external hardware already uses
  // (same AGC, same servoCount) — resampled to exactly 8 to match the real firmware's fixed pin
  // count, then sent to the worker running the real compiled firmware, throttled to ~20Hz (no
  // need to postMessage a new command every single render frame). If the worker isn't ready yet
  // (or failed to load — offline, CDN blocked), target falls back to the commanded angles
  // directly, same as the app always did before this existed, so the preview never breaks.
  const commandAngles = resampleToFirmwareServoCount(computeServoAngles());
  if(hwFirmwareState === 'idle') ensureHwFirmwareWorker(); // fire-and-forget; only kicks off once
  let target = commandAngles;
  hwSim.usingRealFirmware = false;
  if(hwFirmwareState === 'ready' && hwFirmwareAngles){
    target = hwFirmwareAngles; // the real angle the real firmware's real PWM last emitted, read from the worker — no per-frame simulation cost on this thread
    hwSim.usingRealFirmware = true;
    hwFirmwareCommandTimer += dt;
    if(hwFirmwareCommandTimer > HW_FIRMWARE_COMMAND_INTERVAL){
      hwFirmwareCommandTimer = 0;
      hwFirmwareWorker.postMessage({ type: 'command', angles: commandAngles });
    }
  }
  updateHwFirmwareStatusUi();

  const maxStep = HW_SERVO_SLEW_DEG_PER_SEC * dt; // real servos can't snap instantly to a new angle
  const moodMul = hardwareEngine.connected ? 1.4 : 1.0; // perk up when an actual rig/bridge is connected
  // Real beat-onset signal, already computed for the main field's shimmer (audioEngine.beatPulse) —
  // reused here as a shared burst boost across every emitter on every detected beat. Only active
  // in Audio mode; 0 otherwise, so it never fakes motion when there's no real beat to react to.
  const beat = (engine.mode === 'audio') ? audioEngine.beatPulse : 0;
  let avgEnergy = 0;

  for(let i = 0; i < hwSim.count; i++){
    const cur = hwSim.currentAngles[i];
    const tgt = target[i] !== undefined ? target[i] : 90;
    const step = Math.max(-maxStep, Math.min(maxStep, tgt - cur));
    const prevAngle = cur;
    hwSim.currentAngles[i] = cur + step;
    const angle = hwSim.currentAngles[i];

    // Energy = how displaced from neutral + how fast this channel is actually moving right now
    // (the slew-limited per-frame delta is a real, physically-bounded rate — same discipline as
    // the standalone dashboard's angle-deviation-plus-rate-of-change measure).
    const deviation = Math.abs(angle - 90) / 90; // 0..1
    const delta = Math.abs(step) / maxStep; // 0..1, how close to max real servo speed this frame
    const instant = Math.min(1, deviation * 0.5 + delta * 1.6 + beat * 0.6);
    hwSim.emitterEnergy[i] = hwSim.emitterEnergy[i] * 0.75 + instant * 0.25;

    // Milestone spark when a channel actually reaches a real extreme (0° or 180°)
    const nearExtreme = angle < HW_SPARK_THRESHOLD_DEG || angle > 180 - HW_SPARK_THRESHOLD_DEG;
    const wasNearExtreme = prevAngle < HW_SPARK_THRESHOLD_DEG || prevAngle > 180 - HW_SPARK_THRESHOLD_DEG;
    if(nearExtreme && !wasNearExtreme) hwSim.sparkT[i] = 0;
    let flash = 0;
    if(hwSim.sparkT[i] >= 0){
      hwSim.sparkT[i] += dt;
      const p = hwSim.sparkT[i] / HW_SPARK_DURATION;
      if(p >= 1) hwSim.sparkT[i] = -1;
      else flash = 1 - p;
    }

    const energy = Math.min(1, hwSim.emitterEnergy[i] * moodMul + flash * 0.8);

    // Marker glow scales purely with real deviation — at energy 0 it's fully dark and static,
    // no time-based idle bob anymore (removed per user request: an idle channel should show
    // nothing until there's real activity, not a small decorative shimmer). Ring scale uses the
    // same sqrt curve as the particles below, for the same reason: linear-from-zero made moderate
    // real energy look barely different from idle.
    hwSim.markerMats[i].emissiveIntensity = deviation * 0.9 + flash * 1.4;
    hwSim.emitterMarkers[i].scale.setScalar(1 + Math.sqrt(energy) * 0.7);

    // Continuous respawn scaled by this channel's energy — always some launches even idle, never
    // a fully dead canister (same "no dead zone" principle as the main app's turbulence/speed fix).
    // Gravity bends each particle's straight-up launch into a real ballistic arc.
    for(let p = i * HW_PER_EMITTER_PARTICLES; p < (i + 1) * HW_PER_EMITTER_PARTICLES; p++){
      hwSim.pAge[p] += dt;
      if(hwSim.pAge[p] >= hwSim.pLife[p]) hwSim.respawnParticle(p, energy);
      const lifeT = hwSim.pAge[p] / hwSim.pLife[p];
      hwSim.pVel[p].y -= HW_GRAVITY * dt;

      // Apex burst — the instant a particle crosses from rising to falling, give it a brief
      // outward kick (still subject to gravity afterward, so it keeps falling naturally) and a
      // flash, like a shell popping at the top of its arc rather than just quietly turning over.
      const rising = hwSim.pVel[p].y > 0;
      if(hwSim.pWasRising[p] && !rising){
        hwSim.pPopT[p] = 0;
        const kick = 0.5 + energy * 1.1;
        hwSim.pVel[p].x += (Math.random() - 0.5) * kick;
        hwSim.pVel[p].z += (Math.random() - 0.5) * kick;
      }
      hwSim.pWasRising[p] = rising ? 1 : 0;
      let popFlash = 0;
      if(hwSim.pPopT[p] >= 0){
        hwSim.pPopT[p] += dt;
        const pp = hwSim.pPopT[p] / HW_POP_DURATION;
        if(pp >= 1) hwSim.pPopT[p] = -1;
        else popFlash = 1 - pp;
      }

      hwSim.positions[p * 3] += hwSim.pVel[p].x * dt;
      hwSim.positions[p * 3 + 1] += hwSim.pVel[p].y * dt;
      hwSim.positions[p * 3 + 2] += hwSim.pVel[p].z * dt;
      const fade = Math.sin(Math.min(1, lifeT) * Math.PI);
      // Same sqrt curve as the velocity above — energy=0 still means size=0 (nothing renders when
      // truly idle), but moderate real energy now produces a clearly visible size instead of a
      // faint speck.
      hwSim.sizesAttr[p] = (Math.sqrt(energy) * 3.6) * fade + popFlash * 1.8;
    }
    avgEnergy += energy;
  }
  avgEnergy = hwSim.count ? avgEnergy / hwSim.count : 0;

  // Trail echoes — a cheap comet tail: each echo eases toward its lead particle's current
  // position (just written above) with its own lag, no independent physics of its own. Real
  // motion drives it; this is a smoothed rendering of that motion, not a second data source.
  for(let k = 0; k < hwSim.trailCount; k++){
    const lag = HW_TRAIL_LAG[k], scale = HW_TRAIL_SCALE[k];
    for(let p = 0; p < hwSim.total; p++){
      const echoIdx = hwSim.total + k * hwSim.total + p;
      hwSim.positions[echoIdx * 3]     += (hwSim.positions[p * 3]     - hwSim.positions[echoIdx * 3])     * lag;
      hwSim.positions[echoIdx * 3 + 1] += (hwSim.positions[p * 3 + 1] - hwSim.positions[echoIdx * 3 + 1]) * lag;
      hwSim.positions[echoIdx * 3 + 2] += (hwSim.positions[p * 3 + 2] - hwSim.positions[echoIdx * 3 + 2]) * lag;
      hwSim.sizesAttr[echoIdx] = hwSim.sizesAttr[p] * scale;
    }
  }

  hwSim.geo.attributes.position.needsUpdate = true;
  hwSim.geo.attributes.size.needsUpdate = true;

  // Interactive camera: OrbitControls (drag to orbit, scroll to zoom) once loaded, with a
  // user-toggleable auto-rotate (hwSimAutoRotate) instead of v1.27.0's forced always-on drift
  // that had no way to be stopped. Falls back to the static side/angled preset camera (set by
  // setHwSimView, untouched here) until the controls module lands.
  if(hwSim.controls) hwSim.controls.update();

  if(hwSim.composer){
    hwSim.bloomPass.strength = 0.15 + avgEnergy * 0.28; // more activity = more glow, never fully off
    hwSim.composer.render();
  } else {
    hwSim.renderer.render(hwSim.scene, hwSim.camera);
  }
}


function initAudioContext(){
  if(audioEngine.ctx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audioEngine.ctx = new Ctx();
  audioEngine.analyser = audioEngine.ctx.createAnalyser();
  audioEngine.analyser.fftSize = 1024;
  audioEngine.analyser.smoothingTimeConstant = 0.75;
  audioEngine.freqData = new Uint8Array(audioEngine.analyser.frequencyBinCount);
}

function disconnectAudioSource(){
  if(audioEngine.sourceNode){
    try{ audioEngine.sourceNode.disconnect(); }catch(e){}
    audioEngine.sourceNode = null;
  }
  if(audioEngine.micStream){
    audioEngine.micStream.getTracks().forEach(tr => tr.stop());
    audioEngine.micStream = null;
  }
  if(audioEngine.audioEl){
    audioEngine.audioEl.pause();
  }
  audioEngine.active = false;
  if(audioEngine.sourceKind !== 'stems') audioEngine.sourceKind = null;
  audioEngine.level = 0; audioEngine.levelSmooth = 0; audioEngine.silenceTimer = 0;
  const meter = document.getElementById('audioLevelMeter');
  if(meter) meter.style.width = '0%';
  const warning = document.getElementById('audioSilenceWarning');
  if(warning) warning.style.display = 'none';
}

function disconnectStems(){
  STEM_KEYS.forEach(key=>{
    const s = audioEngine.stems[key];
    if(!s) return;
    try{ s.sourceNode && s.sourceNode.disconnect(); }catch(e){}
    s.audioEl.pause();
  });
  audioEngine.stemsActive = false;
  audioEngine.soloedStem = null;
  if(audioEngine.sourceKind === 'stems') audioEngine.sourceKind = null;
}

async function loadAudioFile(file){
  initAudioContext();
  if(audioEngine.ctx.state === 'suspended') await audioEngine.ctx.resume();
  disconnectStems();
  disconnectAudioSource();

  if(!audioEngine.audioEl){
    audioEngine.audioEl = new Audio();
    audioEngine.audioEl.loop = true;
    audioEngine.audioEl.crossOrigin = 'anonymous';
  }
  const url = URL.createObjectURL(file);
  audioEngine.audioEl.src = url;

  // A given <audio> element can only have one MediaElementSourceNode ever created for it.
  if(!audioEngine._fileSourceNode){
    audioEngine._fileSourceNode = audioEngine.ctx.createMediaElementSource(audioEngine.audioEl);
  }
  audioEngine._fileSourceNode.connect(audioEngine.analyser);
  audioEngine.analyser.connect(audioEngine.ctx.destination);
  audioEngine.sourceNode = audioEngine._fileSourceNode;
  audioEngine.sourceKind = 'file';
  await audioEngine.audioEl.play();
  audioEngine.active = true;
}

async function startMic(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    initAudioContext();
    if(audioEngine.ctx.state === 'suspended') await audioEngine.ctx.resume();
    disconnectStems();
    disconnectAudioSource();
    audioEngine.micStream = stream;
    const micNode = audioEngine.ctx.createMediaStreamSource(stream);
    micNode.connect(audioEngine.analyser);
    // deliberately not connected to destination — avoids feedback/echo
    audioEngine.sourceNode = micNode;
    audioEngine.sourceKind = 'mic';
    audioEngine.active = true;
  } catch(e){
    toast('Microphone access denied or unavailable');
  }
}

/* --- Stem files (already separated by an external tool — see STEM_KEYS note above) --- */
async function loadStemFile(stemKey, file){
  initAudioContext();
  if(audioEngine.ctx.state === 'suspended') await audioEngine.ctx.resume();
  if(!audioEngine.stemsActive) disconnectAudioSource(); // leaving single/mic mode
  audioEngine.stemsActive = true;
  audioEngine.sourceKind = 'stems';

  let s = audioEngine.stems[stemKey];
  if(!s){
    s = audioEngine.stems[stemKey] = {
      audioEl: new Audio(),
      sourceNode: null,
      analyser: audioEngine.ctx.createAnalyser(),
      gainNode: audioEngine.ctx.createGain(), // lets Solo mute/unmute this stem's audible output without touching playback or the analyser tap feeding the visuals
      freqData: null,
      colEnergy: new Float32Array(GRID_COLS),
      energy: 0,
    };
    s.audioEl.loop = true;
    s.audioEl.crossOrigin = 'anonymous';
    s.analyser.fftSize = 1024;
    s.analyser.smoothingTimeConstant = 0.75;
    s.freqData = new Uint8Array(s.analyser.frequencyBinCount);
  }
  const url = URL.createObjectURL(file);
  s.audioEl.src = url;

  if(!s.sourceNode){
    s.sourceNode = audioEngine.ctx.createMediaElementSource(s.audioEl);
  }
  try{ s.sourceNode.disconnect(); }catch(e){}
  s.sourceNode.connect(s.analyser);
  try{ s.analyser.disconnect(); }catch(e){}
  // analyser -> gain -> destination: the analyser taps the full, un-muted signal (so Solo/Mute
  // never affects what drives the visualization, only what you actually hear), and Solo state
  // just sets this stem's gain — it keeps playing in sync even while silent, so nothing drifts.
  s.analyser.connect(s.gainNode);
  try{ s.gainNode.disconnect(); }catch(e){}
  s.gainNode.connect(audioEngine.ctx.destination);
  s.gainNode.gain.value = (audioEngine.soloedStem && audioEngine.soloedStem !== stemKey) ? 0 : 1;

  // roughly align to whatever else is already playing
  const playing = STEM_KEYS.map(k => audioEngine.stems[k]).find(o => o && !o.audioEl.paused);
  if(playing) s.audioEl.currentTime = playing.audioEl.currentTime;

  await s.audioEl.play();
}

// Shared by the individual file pickers and the drag-and-drop zone below — loads the file for
// one stem key and brings the transport UI into the "stems active" state, or toasts on failure.
async function loadStemFileIntoUi(stemKey, file){
  try{
    await loadStemFile(stemKey, file);
    if(!audioEngine.stemsActive) return; // user switched to a single file/mic while this was loading
    document.getElementById('audioStatus').textContent = 'No audio source connected.';
    document.getElementById('audioTransport').style.display = 'none';
    document.getElementById('micStopBtn').style.display = 'none';
    document.getElementById('stemLegend').style.display = 'flex';
    document.getElementById('stemsTransport').style.display = 'flex';
    document.getElementById('stemsPlayPauseBtn').textContent = 'Pause stems';
    updateStemsStatusText();
    updateStemSoloButtons();
  } catch(err){
    toast(`Could not load ${STEM_LABELS[stemKey]}`);
  }
}

// Toggles isolating one stem's audible output. Clicking the already-soloed stem's button clears
// the solo (everyone audible again); clicking a different one switches which is isolated. Every
// stem keeps playing regardless — this only sets gain, so a muted stem stays perfectly in sync
// and the visualization (which taps the signal before the gain node) keeps reacting to all four.
function setStemSolo(stemKey){
  audioEngine.soloedStem = (audioEngine.soloedStem === stemKey) ? null : stemKey;
  STEM_KEYS.forEach(k => {
    const s = audioEngine.stems[k];
    if(!s) return;
    s.gainNode.gain.value = (!audioEngine.soloedStem || audioEngine.soloedStem === k) ? 1 : 0;
  });
  updateStemSoloButtons();
}

function updateStemSoloButtons(){
  document.querySelectorAll('.stem-solo-btn').forEach(btn => {
    const isSoloed = audioEngine.soloedStem === btn.dataset.stem;
    btn.classList.toggle('accent', isSoloed);
    btn.classList.toggle('secondary', !isSoloed);
    btn.textContent = isSoloed ? 'Soloed' : 'Solo';
  });
}

// Guesses which stem a dropped file is from its filename (e.g. "song - Vocals.wav" -> 'vocals').
// Demucs/LALAL.AI/Moises all name their exports along these lines, so this covers the common
// case; anything that doesn't match a keyword is left for the person to assign by hand instead.
const STEM_NAME_HINTS = {
  vocals: ['vocal', 'voice', 'acapella', 'lead'],
  drums: ['drum', 'perc'],
  bass: ['bass'],
  other: ['other', 'instrumental', 'guitar', 'accompaniment', 'music'],
};
function guessStemKeyFromFilename(name){
  const n = name.toLowerCase();
  for(const key of STEM_KEYS){
    if(STEM_NAME_HINTS[key].some(hint => n.includes(hint))) return key;
  }
  return null;
}

async function handleDroppedStemFiles(files){
  const audioFiles = Array.from(files).filter(f => f.type.startsWith('audio/') || /\.(wav|mp3|m4a|flac|ogg|aac)$/i.test(f.name));
  if(!audioFiles.length){ toast('Drop audio files (Vocals/Drums/Bass/Other)'); return; }
  const unmatched = [];
  for(const file of audioFiles){
    const key = guessStemKeyFromFilename(file.name);
    if(key) await loadStemFileIntoUi(key, file);
    else unmatched.push(file.name);
  }
  if(unmatched.length){
    toast(unmatched.length === 1
      ? `Couldn't tell which stem "${unmatched[0]}" is — use the buttons above for that one`
      : `Couldn't tell which stems ${unmatched.length} of those files are — use the buttons above for those`);
  }
}

function stemsLoadedCount(){
  return STEM_KEYS.reduce((n, k) => n + (audioEngine.stems[k] ? 1 : 0), 0);
}

function toggleStemsPlayback(){
  const loaded = STEM_KEYS.map(k => audioEngine.stems[k]).filter(Boolean);
  if(!loaded.length) return;
  const shouldPlay = loaded[0].audioEl.paused;
  loaded.forEach(s => shouldPlay ? s.audioEl.play() : s.audioEl.pause());
  return shouldPlay;
}

function seekStems(deltaSeconds){
  const loaded = STEM_KEYS.map(k => audioEngine.stems[k]).filter(Boolean);
  loaded.forEach(s => {
    const dur = s.audioEl.duration || Infinity;
    s.audioEl.currentTime = Math.max(0, Math.min(dur, s.audioEl.currentTime + deltaSeconds));
  });
}

function stopStems(){
  const loaded = STEM_KEYS.map(k => audioEngine.stems[k]).filter(Boolean);
  loaded.forEach(s => { s.audioEl.pause(); s.audioEl.currentTime = 0; });
}

/* --- Shared column-energy mapping: log-scaled bin -> grid column, like a real EQ --- */
function accumulateColEnergy(freqData, colEnergyOut, dt){
  const n = freqData.length;
  const minIdx = 1, maxIdx = Math.floor(n * 0.5);
  for(let c = 0; c < GRID_COLS; c++){
    const tt = c / (GRID_COLS - 1);
    const idx = Math.min(maxIdx, Math.floor(minIdx * Math.pow(maxIdx / minIdx, tt)));
    const w = 2;
    let sum = 0, cnt = 0;
    for(let k = Math.max(0, idx - w); k <= Math.min(n - 1, idx + w); k++){ sum += freqData[k]; cnt++; }
    const raw = (sum / cnt) / 255;
    colEnergyOut[c] += (raw - colEnergyOut[c]) * Math.min(1, dt * 10);
  }
}

const HW_STEM_SYNC_CHECK_INTERVAL = 0.5; // seconds between drift checks — correction itself is cheap, but checking every frame isn't needed
const HW_STEM_SYNC_DRIFT_THRESHOLD = 0.08; // 80ms — small enough to catch audible drift, large enough not to over-correct on normal jitter

function updateStemsFrame(dt){
  STEM_KEYS.forEach(key => {
    const s = audioEngine.stems[key];
    if(!s) return;
    // Same fix as updateAudioFrame: a paused stem's analyser still holds its last FFT window
    // rather than resetting, so read it as stale and decay toward silence instead.
    if(s.audioEl && s.audioEl.paused){
      const decay = Math.exp(-dt * 6);
      s.energy *= decay;
      for(let c = 0; c < s.colEnergy.length; c++) s.colEnergy[c] *= decay;
      return;
    }
    s.analyser.getByteFrequencyData(s.freqData);
    let sum = 0;
    for(let i = 0; i < s.freqData.length; i++) sum += s.freqData[i];
    s.energy = (sum / s.freqData.length) / 255;
    accumulateColEnergy(s.freqData, s.colEnergy, dt);
  });

  // Periodic drift correction. Independent <audio> elements aren't locked to a shared clock —
  // they can slowly drift apart during playback even under normal conditions, and drift gets
  // worse if the main thread stalls for any reason (a heavy synchronous task delays each
  // element's own playback scheduling unevenly). Stems were previously only aligned once, at
  // load time; this keeps them within threshold continuously so vocals/drums/bass/other don't
  // audibly separate over the length of a song.
  audioEngine.stemSyncTimer += dt;
  if(audioEngine.stemSyncTimer > HW_STEM_SYNC_CHECK_INTERVAL){
    audioEngine.stemSyncTimer = 0;
    const playing = STEM_KEYS.map((k) => audioEngine.stems[k]).filter((s) => s && !s.audioEl.paused);
    if(playing.length > 1){
      const refTime = playing[0].audioEl.currentTime;
      for(let i = 1; i < playing.length; i++){
        if(Math.abs(playing[i].audioEl.currentTime - refTime) > HW_STEM_SYNC_DRIFT_THRESHOLD){
          playing[i].audioEl.currentTime = refTime;
        }
      }
    }
  }

  // Beat detection off the drums stem when present (best transient signal), else bass.
  const beatSource = audioEngine.stems.drums || audioEngine.stems.bass;
  if(beatSource){
    audioEngine.bassEMA += (beatSource.energy - audioEngine.bassEMA) * 0.06;
    audioEngine.beatCooldown -= dt;
    if(beatSource.energy > audioEngine.bassEMA * 1.35 + 0.06 && audioEngine.beatCooldown <= 0){
      audioEngine.beatPulse = 1.0;
      audioEngine.beatCooldown = 0.16;
    }
  }
  audioEngine.beatPulse *= Math.exp(-dt * 7);
}

function updateAudioFrame(dt){
  if(audioEngine.stemsActive){ updateStemsFrame(dt); return; }
  if(!audioEngine.active || !audioEngine.analyser) return;

  // A file-backed source can be paused (Stop or Pause) while audioEngine.active stays true — the
  // analyser node doesn't reset itself once its source stops feeding new samples, it just holds
  // whatever was in its last FFT window. Left unchecked, that meant reading it after pausing kept
  // returning the same "real" activity indefinitely — confirmed by direct user report: the
  // fireworks kept doing exactly what they were doing before, even after stopping the music.
  // Detect a paused file source and explicitly decay toward silence instead of reading stale,
  // frozen analyser data — smooth rather than an abrupt cut, and it naturally covers both Pause
  // and Stop (and a track simply reaching its end) without needing to special-case each button.
  if(audioEngine.audioEl && audioEngine.audioEl.paused){
    const decay = Math.exp(-dt * 6);
    audioEngine.level *= decay;
    audioEngine.levelSmooth *= decay;
    audioEngine.bassEMA *= decay;
    audioEngine.beatPulse *= decay;
    for(let c = 0; c < audioEngine.colEnergy.length; c++) audioEngine.colEnergy[c] *= decay;
    return;
  }

  const analyser = audioEngine.analyser, data = audioEngine.freqData;
  analyser.getByteFrequencyData(data);

  // Overall input level (not just bass) — drives the visible meter and silence detection, so
  // "is this actually connected" is something the person can see, not just infer from a toast.
  let levelSum = 0;
  for(let k = 0; k < data.length; k++) levelSum += data[k];
  audioEngine.level = (levelSum / data.length) / 255;
  audioEngine.levelSmooth += (audioEngine.level - audioEngine.levelSmooth) * 0.15;

  // Bass energy drives beat detection (kick/bass tends to carry the beat).
  let bassSum = 0;
  const bassBins = 10;
  for(let k = 2; k < 2 + bassBins; k++) bassSum += data[k];
  const bassEnergy = (bassSum / bassBins) / 255;
  audioEngine.bassEMA += (bassEnergy - audioEngine.bassEMA) * 0.06;
  audioEngine.beatCooldown -= dt;
  if(bassEnergy > audioEngine.bassEMA * 1.35 + 0.06 && audioEngine.beatCooldown <= 0){
    audioEngine.beatPulse = 1.0;
    audioEngine.beatCooldown = 0.16;
  }
  audioEngine.beatPulse *= Math.exp(-dt * 7);

  accumulateColEnergy(data, audioEngine.colEnergy, dt);
}

function updateAudioLevelUi(dt){
  const meter = document.getElementById('audioLevelMeter');
  if(!meter) return;
  // *140 rather than *100 so a normal, healthy input level reads as most of the bar, not a
  // sliver — the point is a person can glance at it and tell "yes, this is picking something up."
  meter.style.width = Math.min(100, Math.round(audioEngine.levelSmooth * 140)) + '%';

  const SILENCE_THRESHOLD = 0.03, SILENCE_WARNING_AFTER = 4; // seconds
  if(audioEngine.active && audioEngine.levelSmooth < SILENCE_THRESHOLD) audioEngine.silenceTimer += dt;
  else audioEngine.silenceTimer = 0;
  const warning = document.getElementById('audioSilenceWarning');
  if(warning) warning.style.display = (audioEngine.silenceTimer > SILENCE_WARNING_AFTER) ? 'flex' : 'none';
}

function initEngineIfNeeded(){
  if(three) { attachRenderer(); return; }
  loadThree();
}

async function loadThree(){
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x060708);
  scene.fog = new THREE.Fog(0x060708, 30, 70);

  const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
  camera.position.set(18, 16, 22);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  stage.insertBefore(renderer.domElement, stage.firstChild);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 8;
  controls.maxDistance = 55;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;

  scene.add(new THREE.AmbientLight(0x8899aa, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(12, 20, 10);
  scene.add(key);
  const rim = new THREE.PointLight(0x7dd3fc, 0.8, 60);
  rim.position.set(-14, 8, -12);
  scene.add(rim);
  const fill = new THREE.PointLight(0xffe8c9, 0.4, 60);
  fill.position.set(0, -6, 14);
  scene.add(fill);

  const geo = new THREE.SphereGeometry(0.22, 10, 8);
  const makeMat = (hex) => new THREE.MeshStandardMaterial({ color: hex, metalness: 0.85, roughness: 0.28 });
  // Per-instance vertexColors on InstancedMesh renders near-black in this three.js build
  // (isolated and confirmed: happens even with plain white colors, even on MeshBasicMaterial —
  // not a lighting/color-space issue, the instanced-color path itself is broken here). Instead,
  // each color category gets its own mesh with a normal solid material.color, and every sphere
  // gets written into whichever mesh matches its current category each frame (see tick()).
  const categoryMeshes = { gray: new THREE.InstancedMesh(geo, makeMat(BASE_SPHERE_COLOR), SPHERE_COUNT) };
  STEM_KEYS.forEach(k => { categoryMeshes[k] = new THREE.InstancedMesh(geo, makeMat(STEM_COLORS[k]), SPHERE_COUNT); });
  Object.values(categoryMeshes).forEach(m => {
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.count = 0;
    scene.add(m);
  });

  const dummy = new THREE.Object3D();

  // subtle ground plane for depth reference
  const groundGeo = new THREE.PlaneGeometry(60, 60);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0d, metalness: 0.1, roughness: 0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -6;
  scene.add(ground);

  three = { THREE, scene, camera, renderer, controls, categoryMeshes, dummy, stage };

  buildGrid();
  window.addEventListener('resize', onResize);
  const ro = new ResizeObserver(onResize);
  ro.observe(stage);

  attachControlsSync();
  engine.ready = true;
  resolveTo({ type: 'chaos' });
  requestAnimationFrame(tick);
}

function attachRenderer(){
  const stage = document.getElementById('stage');
  if(three.renderer.domElement.parentElement !== stage){
    stage.insertBefore(three.renderer.domElement, stage.firstChild);
  }
  onResize();
}

function attachControlsSync(){
  const btn = document.getElementById('autoRotateBtn');
  if(btn) btn.textContent = 'Auto-rotate: ' + (engine.autoRotate ? 'on' : 'off');
}

function onResize(){
  if(!three) return;
  const { stage, camera, renderer } = three;
  const w = stage.clientWidth, h = stage.clientHeight;
  if(w === 0 || h === 0) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

/* --- Grid positions and per-sphere state --- */
const state = {
  baseX: new Float32Array(SPHERE_COUNT),
  baseZ: new Float32Array(SPHERE_COUNT),
  currentY: new Float32Array(SPHERE_COUNT),
  targetY: new Float32Array(SPHERE_COUNT),
  chaosPhase: new Float32Array(SPHERE_COUNT),
  chaosSeedX: new Float32Array(SPHERE_COUNT),
  chaosSeedZ: new Float32Array(SPHERE_COUNT),
  delay: new Float32Array(SPHERE_COUNT),
  chaosMode: new Uint8Array(SPHERE_COUNT), // 1 = follow live chaos field, 0 = follow fixed targetY
};

function buildGrid(){
  const rand = mulberry32(42);
  const spacing = 0.62;
  const offX = (GRID_COLS - 1) * spacing / 2;
  const offZ = (GRID_ROWS - 1) * spacing / 2;
  let n = 0;
  for(let j = 0; j < GRID_ROWS; j++){
    for(let i = 0; i < GRID_COLS; i++){
      state.baseX[n] = i * spacing - offX;
      state.baseZ[n] = j * spacing - offZ;
      state.currentY[n] = 0;
      state.targetY[n] = 0;
      state.chaosPhase[n] = rand() * Math.PI * 2;
      state.chaosSeedX[n] = rand() * 1000;
      state.chaosSeedZ[n] = rand() * 1000;
      state.delay[n] = rand();
      state.chaosMode[n] = 1;
      n++;
    }
  }
}

/* Cheap value-noise (sum of sines) — good enough for organic drift, no deps. */
function noise2D(x, y, t){
  return (
    Math.sin(x * 1.3 + t * 0.9) * Math.cos(y * 1.1 - t * 0.7) +
    Math.sin(x * 0.6 - y * 0.8 + t * 1.3) * 0.6 +
    Math.sin((x + y) * 0.35 + t * 0.5) * 0.4
  ) / 2.0;
}

/* --- Shape rasterization: draw a target onto an offscreen canvas, sample per grid cell --- */
const rasterCanvas = document.createElement('canvas');
rasterCanvas.width = GRID_COLS * 8;
rasterCanvas.height = GRID_ROWS * 8;
const rasterCtx = rasterCanvas.getContext('2d', { willReadFrequently: true });

function rasterizeText(text){
  const ctx = rasterCtx, W = rasterCanvas.width, H = rasterCanvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let size = H * 0.85;
  ctx.font = `800 ${size}px 'Space Grotesk', Inter, sans-serif`;
  while(ctx.measureText(text).width > W * 0.92 && size > 6){
    size -= 2;
    ctx.font = `800 ${size}px 'Space Grotesk', Inter, sans-serif`;
  }
  ctx.fillText(text, W / 2, H / 2 + size * 0.03);
}

function rasterizePreset(preset){
  const ctx = rasterCtx, W = rasterCanvas.width, H = rasterCanvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';

  if(preset === 'circle'){
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.42, 0, Math.PI * 2);
    ctx.fill();
  } else if(preset === 'car'){
    const midY = H * 0.62;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, midY);
    ctx.lineTo(W * 0.10, H * 0.44);
    ctx.lineTo(W * 0.28, H * 0.30);
    ctx.lineTo(W * 0.60, H * 0.30);
    ctx.lineTo(W * 0.74, H * 0.44);
    ctx.lineTo(W * 0.94, midY);
    ctx.lineTo(W * 0.94, H * 0.72);
    ctx.lineTo(W * 0.06, H * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.24, H * 0.74, H * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.76, H * 0.74, H * 0.11, 0, Math.PI * 2); ctx.fill();
  } else if(preset === 'skyline'){
    const rand = mulberry32(7);
    let x = 0;
    while(x < W){
      const bw = W * (0.05 + rand() * 0.07);
      const bh = H * (0.25 + rand() * 0.6);
      ctx.fillRect(x, H - bh, bw, bh);
      x += bw + W * 0.01;
    }
  } else if(preset === 'blob'){
    const rand = mulberry32(19);
    const cx = W / 2, cy = H / 2, base = Math.min(W, H) * 0.36;
    const pts = 24;
    ctx.beginPath();
    for(let k = 0; k <= pts; k++){
      const a = (k / pts) * Math.PI * 2;
      const r = base * (0.72 + rand() * 0.56);
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.75;
      if(k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }
}

function sampleRasterToTargets(peakHeight){
  const W = rasterCanvas.width, H = rasterCanvas.height;
  const img = rasterCtx.getImageData(0, 0, W, H).data;
  const cellW = W / GRID_COLS, cellH = H / GRID_ROWS;
  let n = 0;
  for(let j = 0; j < GRID_ROWS; j++){
    for(let i = 0; i < GRID_COLS; i++){
      const px = Math.min(W - 1, Math.floor((i + 0.5) * cellW));
      const py = Math.min(H - 1, Math.floor((j + 0.5) * cellH));
      const idx = (py * W + px) * 4;
      const lit = img[idx] > 120;
      state.targetY[n] = lit ? peakHeight : 0;
      state.chaosMode[n] = 0;
      n++;
    }
  }
}

/* --- Public transition entry point --- */
function resolveTo(spec){
  if(!engine.ready) return;
  if(spec.type === 'chaos'){
    for(let n = 0; n < SPHERE_COUNT; n++) state.chaosMode[n] = 1;
    return;
  }
  if(spec.type === 'text') rasterizeText(spec.text);
  else if(spec.type === 'preset') rasterizePreset(spec.preset);
  sampleRasterToTargets(PEAK_HEIGHT);
}

/* --- Ambient auto-loop --- */
function updateAmbient(dt){
  engine.ambientTimer += dt;
  const t = engine.ambientTimer;
  switch(engine.ambientPhase){
    case 'chaos':
      if(t > 4){ engine.ambientPhase = 'resolving'; engine.ambientTimer = 0;
        const p = AMBIENT_PRESETS[engine.ambientPresetIdx % AMBIENT_PRESETS.length];
        engine.ambientPresetIdx++;
        if(p === 'text') resolveTo({ type: 'text', text: 'MURMUR' });
        else resolveTo({ type: 'preset', preset: p });
      }
      break;
    case 'resolving':
      if(t > 3.5) { engine.ambientPhase = 'hold'; engine.ambientTimer = 0; }
      break;
    case 'hold':
      if(t > 3.5) { engine.ambientPhase = 'unresolving'; engine.ambientTimer = 0; resolveTo({ type: 'chaos' }); }
      break;
    case 'unresolving':
      if(t > 3.5) { engine.ambientPhase = 'chaos'; engine.ambientTimer = 0; }
      break;
  }
}

/* --- Animation loop --- */
let lastT = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if(!three) return;

  updateHwSimulator(now, dt);
  if(engine.mode === 'ambient') updateAmbient(dt * engine.speed);
  if(engine.mode === 'audio'){
    updateAudioFrame(dt);
    updateAudioLevelUi(dt);
  }

  const { THREE, categoryMeshes, dummy, camera, renderer, scene, controls } = three;
  const t = now * 0.001 * engine.speed;
  const lerpRate = 1 - Math.pow(0.0025, dt * 3);
  const audioStemsLive = engine.mode === 'audio' && audioEngine.stemsActive;
  const audioSingleLive = engine.mode === 'audio' && audioEngine.active && !audioStemsLive;
  const audioLive = audioStemsLive || audioSingleLive;

  if(audioStemsLive){
    for(let c = 0; c < GRID_COLS; c++){
      let total = 0, domVal = -1, domIdx = 0;
      for(let ki = 0; ki < STEM_KEYS.length; ki++){
        const s = audioEngine.stems[STEM_KEYS[ki]];
        const v = s ? s.colEnergy[c] : 0;
        total += v;
        if(v > domVal){ domVal = v; domIdx = ki; }
      }
      colTotalBuf[c] = total;
      colDominantBuf[c] = domIdx;
    }
  }

  const counters = { gray: 0 };
  STEM_KEYS.forEach(k => { counters[k] = 0; });

  for(let n = 0; n < SPHERE_COUNT; n++){
    let ty;
    const col = n % GRID_COLS;
    if(audioStemsLive){
      const bandHeight = colTotalBuf[col] * PEAK_HEIGHT * engine.turbulence;
      const shimmer = audioEngine.beatPulse * PEAK_HEIGHT * 0.5 * engine.turbulence * (0.5 + 0.5 * noise2D(state.baseX[n], state.baseZ[n], t * 2));
      const idle = noise2D(state.baseX[n] * 0.4, state.baseZ[n] * 0.4, t * 0.5) * 0.15;
      ty = bandHeight * (0.85 + 0.15 * noise2D(state.baseX[n], state.baseZ[n] + col, t * 0.8)) + shimmer + idle;
    } else if(audioSingleLive){
      const bandHeight = audioEngine.colEnergy[col] * PEAK_HEIGHT * engine.turbulence;
      const shimmer = audioEngine.beatPulse * PEAK_HEIGHT * 0.5 * engine.turbulence * (0.5 + 0.5 * noise2D(state.baseX[n], state.baseZ[n], t * 2));
      const idle = noise2D(state.baseX[n] * 0.4, state.baseZ[n] * 0.4, t * 0.5) * 0.15;
      ty = bandHeight * (0.85 + 0.15 * noise2D(state.baseX[n], state.baseZ[n] + col, t * 0.8)) + shimmer + idle;
    } else if(state.chaosMode[n]){
      const fx = state.baseX[n] * 0.35 + state.chaosSeedX[n];
      const fz = state.baseZ[n] * 0.35 + state.chaosSeedZ[n];
      ty = noise2D(fx, fz, t * 0.6) * 1.6 * engine.turbulence;
    } else {
      // Resolved (fixed-target) spheres still get a small live wobble so Speed/Turbulence
      // remain audibly-visibly "doing something" even outside the chaos phase, instead of
      // going inert the instant a shape is held. Scales to zero when turbulence is 0.
      const wobble = noise2D(state.baseX[n] * 0.5, state.baseZ[n] * 0.5, t * 0.8) * 0.15 * engine.turbulence;
      ty = state.targetY[n] + wobble;
    }
    const rate = lerpRate * (0.6 + state.delay[n] * 0.8);
    state.currentY[n] += (ty - state.currentY[n]) * Math.min(1, rate);

    dummy.position.set(state.baseX[n], state.currentY[n], state.baseZ[n]);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();

    // Color category: which bucket-mesh this sphere's transform goes into this frame.
    // Quiet columns (or non-audio modes) stay neutral gray; loud columns take on
    // whichever stem dominates that column's energy right now.
    let category = 'gray';
    if(audioStemsLive && colTotalBuf[col] > 0.05) category = STEM_KEYS[colDominantBuf[col]];

    const targetMesh = categoryMeshes[category];
    targetMesh.setMatrixAt(counters[category], dummy.matrix);
    counters[category]++;
  }

  Object.keys(categoryMeshes).forEach(key => {
    const m = categoryMeshes[key];
    m.count = counters[key];
    m.instanceMatrix.needsUpdate = true;
  });

  controls.autoRotate = engine.autoRotate;
  controls.update();
  renderer.render(scene, camera);
}

    } catch(err){
      toast('Could not play that file');
    }
  };
  document.getElementById('micBtn').onclick = async ()=>{
    await startMic();
    if(audioEngine.active && audioEngine.sourceKind === 'mic'){
      document.getElementById('audioStatus').textContent = 'Listening to microphone…';
      document.getElementById('audioTransport').style.display = 'none'; // no seek/stop concept for a live mic stream
      document.getElementById('micStopBtn').style.display = 'inline-flex';
      resetStemsUi();
    }
  };
  document.getElementById('micStopBtn').onclick = ()=>{
    disconnectAudioSource();
    document.getElementById('audioStatus').textContent = 'No audio source connected.';
    document.getElementById('micStopBtn').style.display = 'none';
  };
  document.getElementById('audioRewindBtn').onclick = ()=>{
    if(audioEngine.audioEl) audioEngine.audioEl.currentTime = Math.max(0, audioEngine.audioEl.currentTime - 10);
  };
  document.getElementById('audioForwardBtn').onclick = ()=>{
    if(!audioEngine.audioEl) return;
    const dur = audioEngine.audioEl.duration || Infinity;
    audioEngine.audioEl.currentTime = Math.min(dur, audioEngine.audioEl.currentTime + 10);
  };
  document.getElementById('audioStopBtn').onclick = ()=>{
    if(!audioEngine.audioEl) return;
    audioEngine.audioEl.pause();
    audioEngine.audioEl.currentTime = 0;
    document.getElementById('audioPlayPauseBtn').textContent = 'Play';
  };
  document.getElementById('audioPlayPauseBtn').onclick = (e)=>{
    if(!audioEngine.audioEl) return;
    if(audioEngine.audioEl.paused){ audioEngine.audioEl.play(); e.target.textContent = 'Pause'; }
    else { audioEngine.audioEl.pause(); e.target.textContent = 'Play'; }
  };
  document.querySelectorAll('.stem-input').forEach(inp=>{
    inp.onchange = (e)=>{
      const file = e.target.files && e.target.files[0];
      if(file) loadStemFileIntoUi(inp.dataset.stem, file);
    };
  });
  const stemsDropzone = document.getElementById('stemsDropzone');
  if(stemsDropzone){
    let dragDepth = 0; // counts nested dragenter/dragleave pairs so a child element's leave doesn't drop the highlight early
    stemsDropzone.addEventListener('dragenter', (e)=>{
      e.preventDefault();
      dragDepth++;
      stemsDropzone.style.borderColor = 'var(--accent)';
      stemsDropzone.style.background = 'rgba(125, 211, 252, 0.06)';
    });
    stemsDropzone.addEventListener('dragover', (e)=> e.preventDefault());
    stemsDropzone.addEventListener('dragleave', (e)=>{
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if(dragDepth === 0){
        stemsDropzone.style.borderColor = '';
        stemsDropzone.style.background = '';
      }
    });
    stemsDropzone.addEventListener('drop', (e)=>{
      e.preventDefault();
      dragDepth = 0;
      stemsDropzone.style.borderColor = '';
      stemsDropzone.style.background = '';
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
        handleDroppedStemFiles(e.dataTransfer.files);
      }
    });
  }
  document.getElementById('stemsPlayPauseBtn').onclick = (e)=>{
    const nowPlaying = toggleStemsPlayback();
    if(nowPlaying !== undefined) e.target.textContent = nowPlaying ? 'Pause stems' : 'Play stems';
  };
  document.querySelectorAll('.stem-solo-btn').forEach(btn=>{
    btn.onclick = ()=> setStemSolo(btn.dataset.stem);
  });
  document.getElementById('stemsRewindBtn').onclick = ()=>seekStems(-10);
  document.getElementById('stemsForwardBtn').onclick = ()=>seekStems(10);
  document.getElementById('stemsStopBtn').onclick = ()=>{
    stopStems();
    document.getElementById('stemsPlayPauseBtn').textContent = 'Play stems';
  };
  document.getElementById('resolveTextBtn').onclick = ()=>{
    const v = document.getElementById('textInput').value.trim();
    if(!v){ toast('Type something first'); return; }
    const spec = { type:'text', text: v.toUpperCase() };
    engine.manualSpec = spec;
    resolveTo(spec);
  };
  document.getElementById('scrambleBtn').onclick = ()=>{
    engine.manualSpec = { type:'chaos' };
    resolveTo({ type:'chaos' });
  };
  document.querySelectorAll('.preset-btn').forEach(b=>{
    b.onclick = ()=>{
      const spec = { type:'preset', preset: b.dataset.preset };
      engine.manualSpec = spec;
      resolveTo(spec);
    };
  });
  document.getElementById('speedSlider').oninput = (e)=>{
    engine.speed = parseFloat(e.target.value);
    document.getElementById('speedVal').textContent = engine.speed.toFixed(1);
  };
  document.getElementById('turbSlider').oninput = (e)=>{
    engine.turbulence = parseFloat(e.target.value);
    document.getElementById('turbVal').textContent = engine.turbulence.toFixed(1);
  };
  document.getElementById('autoRotateBtn').onclick = (e)=>{
    engine.autoRotate = !engine.autoRotate;
    e.target.textContent = 'Auto-rotate: ' + (engine.autoRotate ? 'on' : 'off');
  };

  const STAGE_DEFAULT_POS = [18, 16, 22]; // matches loadThree()'s initial camera.position
  function setStageView(pos){
    if(!three) return; // still loading — buttons work again once it's ready, no error needed
    three.camera.position.set(pos[0], pos[1], pos[2]);
    three.controls.target.set(0, 0, 0);
    three.controls.update();
  }
  document.getElementById('stageRecenterBtn').onclick = ()=> setStageView(STAGE_DEFAULT_POS);
  document.getElementById('stageTopBtn').onclick = ()=> setStageView([0, 30, 0.01]); // tiny Z offset avoids OrbitControls gimbal lock straight down
  document.getElementById('stageSideBtn').onclick = ()=> setStageView([30, 2, 0]);
  document.getElementById('shareBtn').onclick = async ()=>{
    const url = buildShareUrl();
    try{
      await navigator.clipboard.writeText(url);
      toast('Link copied — reproduces this mode, shape, and speed');
    } catch(err){
      // Clipboard permission denied/unavailable (older browser, insecure context, etc.) — fall
      // back to just showing it so the person can still grab it by hand.
      window.prompt('Copy this link:', url);
    }
  };
  document.getElementById('recordBtn').onclick = toggleRecording;

  applyUrlState();

  updateModeButtons();
  initEngineIfNeeded();
}

function setMode(m){
  const leavingAudio = engine.mode === 'audio' && m !== 'audio';
  engine.mode = m;
  document.getElementById('manualControls').style.display = m === 'manual' ? 'block' : 'none';
  document.getElementById('audioControls').style.display = m === 'audio' ? 'block' : 'none';
  updateModeButtons();
  if(leavingAudio){
    disconnectAudioSource();
    disconnectStems();
    document.getElementById('audioTransport').style.display = 'none';
    document.getElementById('stemsTransport').style.display = 'none';
    document.getElementById('micStopBtn').style.display = 'none';
    document.getElementById('audioStatus').textContent = 'No audio source connected.';
  }
  if(m === 'ambient'){
    engine.ambientTimer = 0;
    engine.ambientPhase = 'chaos';
    resolveTo({ type:'chaos' });
  } else {
    resolveTo({ type:'chaos' });
  }
}
function resetStemsUi(){
  disconnectStems(); // also clears audioEngine.soloedStem
  const legend = document.getElementById('stemLegend');
  const transport = document.getElementById('stemsTransport');
  const status = document.getElementById('stemsStatus');
  if(legend) legend.style.display = 'none';
  if(transport) transport.style.display = 'none'; // hides everything inside, including the play/pause button — no need to also hide it individually (that inline override was never cleared when stems reloaded, which is why the button stayed invisible for good after the first reset)
  if(status) status.textContent = '';
  document.querySelectorAll('.stem-input').forEach(inp => inp.value = '');
  updateStemSoloButtons();
}

function updateStemsStatusText(){
  const status = document.getElementById('stemsStatus');
  if(!status) return;
  const loaded = STEM_KEYS.filter(k => audioEngine.stems[k]).map(k => STEM_LABELS[k]);
  const missing = STEM_KEYS.filter(k => !audioEngine.stems[k]).map(k => STEM_LABELS[k]);
  status.textContent = `Loaded: ${loaded.join(', ')}.` + (missing.length ? ` Not provided: ${missing.join(', ')}.` : '');
}

function updateHardwareUi(){
  const connectBtn = document.getElementById('hwConnectBtn');
  const disconnectBtn = document.getElementById('hwDisconnectBtn');
  if(!connectBtn || !disconnectBtn) return;
  connectBtn.style.display = hardwareEngine.connected ? 'none' : 'inline-flex';
  disconnectBtn.style.display = hardwareEngine.connected ? 'inline-flex' : 'none';
}

function updateModeButtons(){
  const a = document.getElementById('modeAmbient'), m = document.getElementById('modeManual'), u = document.getElementById('modeAudio');
  if(!a || !m || !u) return;
  a.className = 'btn ' + (engine.mode === 'ambient' ? '' : 'secondary');
  m.className = 'btn ' + (engine.mode === 'manual' ? '' : 'secondary');
  u.className = 'btn ' + (engine.mode === 'audio' ? '' : 'secondary');
}

/* ================= Share link =================
   Captures mode + speed + turbulence, and (Manual mode only) the resolved text/preset, into URL
   query params. Audio mode can't carry an actual audio file through a link, so a shared audio-mode
   link just lands the visitor on the Audio panel ready to pick a source — same as if a
   sound-driven look were expected to always start fresh each session, since sound comes from
   whatever *they* choose to play, not from what you had loaded. */
function buildShareUrl(){
  const params = new URLSearchParams();
  params.set('mode', engine.mode);
  params.set('speed', engine.speed.toFixed(1));
  params.set('turbulence', engine.turbulence.toFixed(1));
  if(engine.mode === 'manual' && engine.manualSpec){
    if(engine.manualSpec.type === 'text') params.set('text', engine.manualSpec.text);
    else if(engine.manualSpec.type === 'preset') params.set('preset', engine.manualSpec.preset);
    // type 'chaos' (scrambled) needs no extra param — landing in Manual with neither text nor
    // preset set already reads as scrambled, since nothing else has been resolved yet.
  }
  const url = new URL(location.href);
  url.search = params.toString();
  return url.toString();
}

function applyUrlState(){
  const params = new URLSearchParams(location.search);
  if(![...params.keys()].length) return; // plain URL, no shared state to restore — leave the defaults

  const mode = params.get('mode');
  const speed = parseFloat(params.get('speed'));
  const turbulence = parseFloat(params.get('turbulence'));
  const text = params.get('text');
  const preset = params.get('preset');

  if(!isNaN(speed)){
    engine.speed = Math.min(2.5, Math.max(0.2, speed));
    const slider = document.getElementById('speedSlider'), val = document.getElementById('speedVal');
    if(slider) slider.value = engine.speed;
    if(val) val.textContent = engine.speed.toFixed(1);
  }
  if(!isNaN(turbulence)){
    engine.turbulence = Math.min(2, Math.max(0, turbulence));
    const slider = document.getElementById('turbSlider'), val = document.getElementById('turbVal');
    if(slider) slider.value = engine.turbulence;
    if(val) val.textContent = engine.turbulence.toFixed(1);
  }

  if(mode === 'manual' || mode === 'audio') setMode(mode); // ambient is already the default, nothing to switch

  const applyManualSpec = ()=>{
    if(mode !== 'manual') return;
    if(text){
      document.getElementById('textInput').value = text;
      engine.manualSpec = { type:'text', text: text.toUpperCase() };
      resolveTo(engine.manualSpec);
    } else if(preset && MANUAL_PRESET_KEYS.includes(preset)){
      engine.manualSpec = { type:'preset', preset };
      resolveTo(engine.manualSpec);
    }
  };
  if(engine.ready) applyManualSpec();
  else {
    // engine.ready flips once Three.js finishes its async import+setup (initEngineIfNeeded, called
    // right after this) — poll rather than thread a callback through that whole chain for one flag.
    const check = setInterval(()=>{
      if(engine.ready){ clearInterval(check); applyManualSpec(); }
    }, 50);
  }
}

/* ================= Recording =================
   captureStream() + MediaRecorder on the existing WebGL canvas — no server, no extra rendering
   pass, just grabbing frames as they're already being drawn. Downloads a .webm on stop. */
let mediaRecorder = null;
let recordedChunks = [];
let recordTimerInterval = null;
let recordStartTime = 0;

function pickRecordingMimeType(){
  const candidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || null;
}

function toggleRecording(){
  if(mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  else startRecording();
}

function startRecording(){
  if(!three || !three.renderer){ toast('Nothing to record yet'); return; }
  if(!window.MediaRecorder){ toast("This browser can't record video (try Chrome or Edge)"); return; }
  const mimeType = pickRecordingMimeType();
  if(!mimeType){ toast("This browser can't record video (try Chrome or Edge)"); return; }

  const stream = three.renderer.domElement.captureStream(30);
  recordedChunks = [];
  try{
    mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
  } catch(err){
    toast('Could not start recording');
    return;
  }
  mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = ()=>{
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `murmur-${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    toast('Clip saved');
  };
  mediaRecorder.start();
  recordStartTime = performance.now();
  const btn = document.getElementById('recordBtn');
  recordTimerInterval = setInterval(()=>{
    const secs = Math.floor((performance.now() - recordStartTime) / 1000);
    const mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, '0');
    if(btn) btn.textContent = `■ Stop (${mm}:${ss})`;
  }, 250);
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  clearInterval(recordTimerInterval);
  recordTimerInterval = null;
  const btn = document.getElementById('recordBtn');
  if(btn) btn.textContent = '● Record';
}

/* ================= Boot ================= */
function applyThemeChrome(){
  document.getElementById('themeColorMeta').setAttribute('content', '#0B0C0E');
}
// Desktop/tablet only, same convention as Joe's other Three.js tools (e.g. modulor.axisbim.io):
// a hard gate rather than a responsive mobile redesign. Below the breakpoint, the app (Three.js,
// avr8js, the whole render loop) never initializes at all — not just visually hidden — so nothing
// is wasted loading a scene a phone was never going to show. Re-checked on resize/orientation
// change; once booted, a later narrow resize just re-shows the gate over the still-running app
// rather than tearing anything down, and widening back out hides it again.
const SCREEN_GATE_MIN_WIDTH = 768;
let appBooted = false;
function checkScreenGate(){
  const gate = document.getElementById('screenGate');
  const wide = window.innerWidth >= SCREEN_GATE_MIN_WIDTH;
  gate.style.display = wide ? 'none' : 'flex';
  if(wide && !appBooted){
    appBooted = true;
    render();
  }
}
(function boot(){
  applyThemeChrome();
  document.getElementById('footVersion').innerHTML =
    `MURMUR · v${APP_VERSION} · Joe.K · <a href="https://axisbim.io" target="_blank" rel="noopener">axisbim.io</a>`;
  document.getElementById('helpBtn').onclick = showHelp;
  checkScreenGate();
  window.addEventListener('resize', checkScreenGate);
})();

</script>
